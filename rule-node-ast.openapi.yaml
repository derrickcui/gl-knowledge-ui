paths:
  /topics:
    get:
      summary: List topics
      responses:
        "200":
          description: Topic list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePageResponseTopicListItem"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
    post:
      summary: Create topic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopicRequest"
      responses:
        "200":
          description: Topic created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseTopicResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /topics/search:
    get:
      summary: Search topics by status and keyword
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
          description: Topic status filter (e.g. PUBLISHED). Empty means all.
        - name: keyword
          in: query
          required: false
          schema:
            type: string
          description: Keyword matched against topic name or description.
      responses:
        "200":
          description: Topic list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePageResponseTopicListItem"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /topics/{topicId}:
    get:
      summary: Get topic by id
      parameters:
        - name: topicId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Topic detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseTopicDetailResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
    put:
      summary: Update topic metadata
      parameters:
        - name: topicId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopicUpdateRequest"
      responses:
        "200":
          description: Topic detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseTopicDetailResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /topics/{topicId}/draft:
    get:
      summary: Get topic draft
      description: Business-rule facade. Returns UiRuleViewModel only; RuleNode/AST is internal and must not be exposed.
      parameters:
        - name: topicId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Topic draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseTopicDraftBusiness"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
    put:
      summary: Save topic draft (business rule)
      description: Business-rule facade. Accepts UiRuleViewModel only; RuleNode/AST is internal and must not be exposed.
      parameters:
        - name: topicId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopicDraftBusinessRequest"
      responses:
        "200":
          description: Topic draft saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseTopicDraftBusiness"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /topics/{topicId}/submit-review:
    post:
      summary: Submit topic for review
      parameters:
        - name: topicId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopicSubmitReviewBusinessRequest"
      responses:
        "200":
          description: Review submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseTopicSubmitReviewResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /topics/{topicId}/reviews:
    get:
      summary: List topic reviews
      parameters:
        - name: topicId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Review list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseReviewList"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /topics/{topicId}/reviews/{revision}:
    get:
      summary: Get topic review detail
      parameters:
        - name: topicId
          in: path
          required: true
          schema:
            type: string
        - name: revision
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Review detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseTopicReviewDetailResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /topics/{topicId}/reviews/{revision}/decision:
    post:
      summary: Decide topic review
      parameters:
        - name: topicId
          in: path
          required: true
          schema:
            type: string
        - name: revision
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecisionRequest"
      responses:
        "200":
          description: Review decision applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseReviewPacketBusiness"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /topics/{topicId}/publish:
    post:
      summary: Publish topic
      parameters:
        - name: topicId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopicPublishRequest"
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseTopicPublishResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /topics/{topicId}/published:
    get:
      summary: Get latest published topic
      parameters:
        - name: topicId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Published topic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseTopicPublishedResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /topics/{topicId}/published/{revision}:
    get:
      summary: Get published topic by revision
      parameters:
        - name: topicId
          in: path
          required: true
          schema:
            type: string
        - name: revision
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Published topic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseTopicPublishedResponse"
        "404":
