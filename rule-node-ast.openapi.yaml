components:
  schemas:
    RuleNode:
      oneOf:
        - $ref: "#/components/schemas/GroupRule"
        - $ref: "#/components/schemas/LogicRule"
        - $ref: "#/components/schemas/AccumulateRule"
        - $ref: "#/components/schemas/ProximityRule"
        - $ref: "#/components/schemas/ConceptMatchRule"
        - $ref: "#/components/schemas/ConceptScopeRule"
        - $ref: "#/components/schemas/TextMatchRule"
        - $ref: "#/components/schemas/FieldConditionRule"
        - $ref: "#/components/schemas/WhenRule"
        - $ref: "#/components/schemas/TopicRefRule"

    GroupRule:
      type: object
      required: [type, children]
      properties:
        type:
          const: GROUP
        children:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RuleNode"

    LogicRule:
      type: object
      required: [type, operator, children]
      properties:
        type:
          const: LOGIC
        operator:
          enum: [AND, OR, NOT]
        children:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RuleNode"

    AccumulateRule:
      type: object
      required: [type, combineMode, items]
      properties:
        type:
          const: ACCUMULATE
        combineMode:
          enum: [ACCRUE, SUM, PRODUCT, LOGSUM, YESNO]
          description: >-
            ACCRUE does soft matching; the minimum-match threshold is controlled by the request-level `min`
            parameter (0.1-1, where larger means lower threshold; min=1 means any single hit). ACCRUE does not
            support per-item weights (weight prefixes like [1.0] are invalid/ignored in rule text). LOGSUM/SUM/PRODUCT
            only combine scores and never perform hard filtering. Use WEIGHTED/LOGSUM/SUM/PRODUCT when weights are needed.
            Rule text example: <accrue>(<in/DOC_TEXT>foo, <in/DOC_TEXT>bar) (no [1.0] prefixes).
        threshold:
          type: number
          description: >-
            Optional parameter for LOGSUM saturation (logsum/n). Ignored for ACCRUE/SUM/PRODUCT/YESNO.
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/WeightedRule"
      examples:
        accrue_no_weights:
          summary: ACCRUE (soft match, no weight prefixes)
          value:
            type: ACCUMULATE
            combineMode: ACCRUE
            items:
              - weight: 1.0
                rule:
                  type: TEXT_MATCH
                  matchType: PHRASE
                  value: foo
                  caseSensitive: false
              - weight: 1.0
                rule:
                  type: TEXT_MATCH
                  matchType: PHRASE
                  value: bar
                  caseSensitive: false
        weighted_logsum:
          summary: WEIGHTED + LOGSUM (weights are applied)
          value:
            type: ACCUMULATE
            combineMode: LOGSUM
            threshold: 2.0
            items:
              - weight: 0.7
                rule:
                  type: TEXT_MATCH
                  matchType: PHRASE
                  value: foo
                  caseSensitive: false
              - weight: 0.3
                rule:
                  type: TEXT_MATCH
                  matchType: PHRASE
                  value: bar
                  caseSensitive: false

    WeightedRule:
      type: object
      required: [weight, rule]
      properties:
        weight:
          type: number
          description: Used by SUM/PRODUCT/LOGSUM/YESNO; ignored for ACCRUE.
        rule:
          $ref: "#/components/schemas/RuleNode"

    ProximityRule:
      type: object
      required: [type, mode, ordered, left, right]
      properties:
        type:
          const: PROXIMITY
        mode:
          enum: [NEAR, SENTENCE, PARAGRAPH, DOCUMENT]
          description: DOCUMENT means ordered/unordered across the whole document (no proximity window).
        distance:
          type: integer
          minimum: 1
        ordered:
          type: boolean
        left:
          $ref: "#/components/schemas/RuleNode"
        right:
          $ref: "#/components/schemas/RuleNode"

    ConceptMatchRule:
      type: object
      required: [type, mode, conceptIds, includeAliases]
      properties:
        type:
          const: CONCEPT_MATCH
        mode:
          enum: [ANY, ALL]
        conceptIds:
          type: array
          minItems: 1
          items:
            type: string
        includeAliases:
          type: boolean

    ConceptScopeRule:
      type: object
      required: [type, baseConceptId, scope]
      properties:
        type:
          const: CONCEPT_SCOPE
        baseConceptId:
          type: string
        scope:
          enum: [SELF, DESCENDANT, ANCESTOR, RELATED]
        maxDepth:
          type: integer
          minimum: 1

    TextMatchRule:
      type: object
      required: [type, matchType, value, caseSensitive]
      properties:
        type:
          const: TEXT_MATCH
        matchType:
          enum: [WORD, PHRASE, WILDCARD, FREETEXT, STEM, SOUNDEX]
        value:
          type: string
        caseSensitive:
          type: boolean
        fuzz:
          type: integer
          minimum: 0
        typo:
          type: integer
          minimum: 0
        lang:
          type: string

    FieldConditionRule:
      type: object
      required: [type, field, operator, valueType, value]
      properties:
        type:
          const: FIELD_CONDITION
        field:
          type: string
        operator:
          enum: [CONTAINS, STARTS, ENDS, MATCHES, SUBSTRING, EQ, NEQ, GT, GTE, LT, LTE]
        valueType:
          enum: [STRING, NUMBER, DATE]
        value: {}
        timezone:
          type: string

    WhenRule:
      type: object
      required: [type, inField, expr, condition]
      properties:
        type:
          const: WHEN
        inField:
          type: string
          description: Logical field identifier (e.g. DOC_TEXT, DOC_TITLE). Physical fields must not appear in rule APIs.
        expr:
          $ref: "#/components/schemas/RuleNode"
        condition:
          $ref: "#/components/schemas/RuleNode"

    TopicRefRule:
      type: object
      required: [type, topicId, refMode]
      properties:
        type:
          const: TOPIC_REF
        topicId:
          type: string
        refMode:
          enum: [PUBLISHED_ONLY, PINNED_VERSION]
        pinnedVersion:
          type: integer

    RuleLanguageSpec:
      type: object
      required: [version, astSchemaId, ruleTypes, palette, dialects]
      properties:
        version:
          type: string
          example: v1
        astSchemaId:
          type: string
          example: https://geelink.ai/schema/rulenode/v1.json
        ruleTypes:
          type: array
          items:
            type: string
        palette:
          type: array
          items:
            $ref: "#/components/schemas/PaletteItemSpec"
        dialects:
          type: array
          items:
            $ref: "#/components/schemas/DialectSpec"
        metadata:
          type: object
          additionalProperties: true

    PaletteItemSpec:
      type: object
      required: [key, ruleType, label]
      properties:
        key:
          type: string
          example: concept_match
        ruleType:
          type: string
          example: CONCEPT_MATCH
        label:
          type: string
          example: 涉及某类政策概念
        category:
          type: string
          example: concept
        uiParams:
          type: array
          items:
            type: string
        explainHint:
          type: string
          example: 文档内容涉及某一政策概念

    DialectSpec:
      type: object
      required: [locale, industry, templatesByRuleType]
      properties:
        locale:
          type: string
          example: zh-CN
        industry:
          type: string
          example: policy
        templatesByRuleType:
          type: object
          additionalProperties:
            type: string

    ExplainPreviewViewModel:
      type: object
      required: [title, blocks]
      properties:
        title:
          type: string
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/ExplainBlockViewModel"

    ExplainBlockViewModel:
      type: object
      required: [id, text, level, indent]
      properties:
        id:
          type: string
        text:
          type: string
        level:
          $ref: "#/components/schemas/ExplainBlockLevel"
        indent:
          type: integer
        children:
          type: array
          items:
            $ref: "#/components/schemas/ExplainBlockViewModel"
        paletteKey:
          type: string
        ruleType:
          type: string

    ExplainBlockLevel:
      type: string
      enum: [INFO, WARNING]

    SemanticDiffResult:
      type: object
      required: [summary, items]
      properties:
        summary:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/DiffItem"

    DiffItem:
      type: object
      required: [kind, path]
      properties:
        kind:
          $ref: "#/components/schemas/DiffKind"
        path:
          type: string
        beforeText:
          type: string
          nullable: true
        afterText:
          type: string
          nullable: true

    DiffKind:
      type: string
      enum: [ADDED, REMOVED, MODIFIED, MOVED]

    AntiPatternReport:
      type: object
      required: [score, findings]
      properties:
        score:
          type: integer
        findings:
          type: array
          items:
            $ref: "#/components/schemas/Finding"

    Finding:
      type: object
      required: [severity, code, path, message]
      properties:
        severity:
          $ref: "#/components/schemas/Severity"
        code:
          type: string
        path:
          type: string
        message:
          type: string
        meta:
          type: object
          additionalProperties: true

    Severity:
      type: string
      enum: [INFO, WARNING, ERROR]

    ReviewPacket:
      type: object
      required:
        - reviewId
        - topicId
        - topicName
        - baseRule
        - draftRule
        - afterAst
        - status
        - contentHash
        - dialectLocale
        - dialectIndustry
        - submittedAt
        - explain
        - diff
        - antiPatterns
      properties:
        reviewId:
          type: integer
        topicId:
          type: string
        topicName:
          type: string
        baseRule:
          $ref: "#/components/schemas/RuleNode"
        draftRule:
          $ref: "#/components/schemas/RuleNode"
        afterAst:
          $ref: "#/components/schemas/RuleNode"
        status:
          type: string
        contentHash:
          type: string
        dialectLocale:
          type: string
        dialectIndustry:
          type: string
        submittedBy:
          type: string
        submittedAt:
          type: string
          format: date-time
        reviewedBy:
          type: string
        reviewedAt:
          type: string
          format: date-time
        reviewComment:
          type: string
        explain:
          $ref: "#/components/schemas/ExplainPreviewViewModel"
        diff:
          $ref: "#/components/schemas/SemanticDiffResult"
        antiPatterns:
          $ref: "#/components/schemas/AntiPatternReport"
    ExplainLineViewModel:
      type: object
      required: [id, text, level, indent]
      properties:
        id:
          type: string
        text:
          type: string
        level:
          $ref: "#/components/schemas/ExplainBlockLevel"
        indent:
          type: integer
        paletteKey:
          type: string
          nullable: true
        ruleType:
          type: string
          nullable: true
    ExplainPreviewFlatViewModel:
      type: object
      required: [title, lines]
      properties:
        title:
          type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/ExplainLineViewModel"
    ReviewPacketBusinessResponse:
      type: object
      required:
        - reviewId
        - topicId
        - topicName
        - status
        - contentHash
        - submittedAt
        - explain
        - diff
        - antiPatterns
      properties:
        reviewId:
          type: integer
        topicId:
          type: string
        topicName:
          type: string
        baseRule:
          $ref: "#/components/schemas/UiRuleViewModel"
          nullable: true
        draftRule:
          $ref: "#/components/schemas/UiRuleViewModel"
        status:
          type: string
        contentHash:
          type: string
        dialectLocale:
          type: string
        dialectIndustry:
          type: string
        submittedBy:
          type: string
        submittedAt:
          type: string
          format: date-time
        reviewedBy:
          type: string
        reviewedAt:
          type: string
          format: date-time
        reviewComment:
          type: string
        explain:
          $ref: "#/components/schemas/ExplainPreviewViewModel"
        explainFlat:
          $ref: "#/components/schemas/ExplainPreviewFlatViewModel"
          description: Optional flattened explain view for UI adapters/highlighting.
        diff:
          $ref: "#/components/schemas/SemanticDiffResult"
        antiPatterns:
          $ref: "#/components/schemas/AntiPatternReport"
    TopicDetailResponse:
      type: object
      required: [id, name, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
        currentPublishedRevision:
          type: integer
          nullable: true
        templateId:
          type: integer
          format: int64
          nullable: true
        templateVersion:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
          nullable: true
    UiRuleViewModel:
      type: object
      properties:
        root:
          $ref: "#/components/schemas/UiExpressionNode"
        references:
          type: array
          items:
            $ref: "#/components/schemas/UiRuleReference"
    UiExpressionNode:
      oneOf:
        - $ref: "#/components/schemas/UiLogicNode"
        - $ref: "#/components/schemas/UiProximityNode"
        - $ref: "#/components/schemas/UiFieldNode"
        - $ref: "#/components/schemas/UiTermSetNode"
        - $ref: "#/components/schemas/UiNotNode"
        - $ref: "#/components/schemas/UiScoreNode"
        - $ref: "#/components/schemas/UiTopicRefNode"
      discriminator:
        propertyName: type
        mapping:
          LOGIC: "#/components/schemas/UiLogicNode"
          PROXIMITY: "#/components/schemas/UiProximityNode"
          FIELD: "#/components/schemas/UiFieldNode"
          TERM_SET: "#/components/schemas/UiTermSetNode"
          NOT: "#/components/schemas/UiNotNode"
          SCORE: "#/components/schemas/UiScoreNode"
          TOPIC_REF: "#/components/schemas/UiTopicRefNode"
    UiLogicNode:
      type: object
      required: [type, operator, children]
      properties:
        type:
          type: string
          enum: [LOGIC]
        operator:
          $ref: "#/components/schemas/UiLogicOperator"
        threshold:
          type: integer
          nullable: true
        minMatch:
          type: integer
          nullable: true
        children:
          type: array
          items:
            $ref: "#/components/schemas/UiExpressionNode"
    UiProximityNode:
      type: object
      required: [type, relation, children]
      properties:
        type:
          type: string
          enum: [PROXIMITY]
        relation:
          $ref: "#/components/schemas/UiProximityRelation"
        ordered:
          type: boolean
          nullable: true
        distance:
          type: integer
          nullable: true
        children:
          type: array
          items:
            $ref: "#/components/schemas/UiExpressionNode"
    UiFieldNode:
      type: object
      required: [type, field, child]
      properties:
        type:
          type: string
          enum: [FIELD]
        field:
          $ref: "#/components/schemas/UiField"
        child:
          $ref: "#/components/schemas/UiExpressionNode"
    UiTermSetNode:
      type: object
      required: [type, terms, matchMode]
      properties:
        type:
          type: string
          enum: [TERM_SET]
        terms:
          type: array
          items:
            $ref: "#/components/schemas/UiExpression"
        matchMode:
          $ref: "#/components/schemas/RuleMatchMode"
    UiNotNode:
      type: object
      required: [type, child]
      properties:
        type:
          type: string
          enum: [NOT]
        child:
          $ref: "#/components/schemas/UiExpressionNode"
    UiScoreNode:
      type: object
      required: [type, operator, children]
      properties:
        type:
          type: string
          enum: [SCORE]
        operator:
          $ref: "#/components/schemas/UiLogicOperator"
        threshold:
          type: integer
          nullable: true
        minMatch:
          type: integer
          nullable: true
        children:
          type: array
          items:
            $ref: "#/components/schemas/UiExpressionNode"
    UiTopicRefNode:
      type: object
      required: [type, topicId]
      properties:
        type:
          type: string
          enum: [TOPIC_REF]
        topicId:
          type: string
    UiExpression:
      type: object
      required: [source, conceptId, includeDescendants]
      properties:
        source:
          $ref: "#/components/schemas/UiExpressionSource"
        conceptId:
          type: string
        conceptName:
          type: string
          nullable: true
        includeDescendants:
          type: boolean
    UiRuleReference:
      type: object
      required: [type, topicId, mode]
      properties:
        type:
          $ref: "#/components/schemas/UiRuleReferenceType"
        topicId:
          type: string
        mode:
          $ref: "#/components/schemas/UiRuleReferenceMode"
    UiRuleReferenceType:
      type: string
      enum: [TOPIC]
    UiRuleReferenceMode:
      type: string
      enum: [AND, OR]
    UiLogicOperator:
      type: string
      enum: [AND, OR, ACCRUE, LOGSUM, WEIGHTED]
    UiProximityRelation:
      type: string
      enum: [NEAR, SENTENCE, PARAGRAPH, PHRASE]
    UiField:
      type: string
      enum: [CONTENT, TITLE, COLUMN]
    UiExpressionSource:
      type: string
      enum: [CONCEPT, TERM]
    RuleMatchMode:
      type: string
      enum: [ANY, ALL]
    UiCapabilityViewModel:
      type: object
      properties:
        semantic:
          $ref: "#/components/schemas/UiSemanticCapability"
        structure:
          $ref: "#/components/schemas/UiStructureCapability"
        where:
          $ref: "#/components/schemas/UiWhereCapability"
        advanced:
          $ref: "#/components/schemas/UiAdvancedCapability"
    UiSemanticCapability:
      type: object
      properties:
        allowModes:
          type: array
          items:
            $ref: "#/components/schemas/UiSemanticMode"
          uniqueItems: true
        allowThreshold:
          type: boolean
        allowWeighted:
          type: boolean
    UiStructureCapability:
      type: object
      properties:
        allowRelation:
          type: array
          items:
            $ref: "#/components/schemas/UiStructureRelation"
          uniqueItems: true
        allowOrder:
          type: boolean
        allowDistance:
          type: boolean
    UiWhereCapability:
      type: object
      properties:
        allowFields:
          type: array
          items:
            $ref: "#/components/schemas/UiField"
          uniqueItems: true
    UiAdvancedCapability:
      type: object
      properties:
        allowNot:
          type: boolean
        allowTopicRef:
          type: boolean
        allowExcludeGroup:
          type: boolean
    UiSemanticMode:
      type: string
      enum: [OR, AND, ANY, AT_LEAST, ACCRUE, WEIGHTED, EXCLUDE]
    UiStructureRelation:
      type: string
      enum: [NONE, NEAR, SENTENCE, PARAGRAPH]
    RuleStateResponse:
      type: object
      required: [id, rule, capability, explain, updatedAt]
      properties:
        id:
          type: string
        rule:
          $ref: "#/components/schemas/UiRuleViewModel"
        capability:
          $ref: "#/components/schemas/UiCapabilityViewModel"
        explain:
          $ref: "#/components/schemas/ExplainPreviewViewModel"
        updatedAt:
          type: string
          format: date-time
    TopicDraftBusinessRequest:
      type: object
      required: [rule]
      properties:
        rule:
          $ref: "#/components/schemas/UiRuleViewModel"
        explainOverrides:
          type: object
          additionalProperties:
            type: string
        updatedBy:
          type: string
          nullable: true
    TopicDraftBusinessResponse:
      type: object
      required: [rule, explain, updatedAt]
      properties:
        rule:
          $ref: "#/components/schemas/UiRuleViewModel"
        capability:
          $ref: "#/components/schemas/UiCapabilityViewModel"
        explain:
          $ref: "#/components/schemas/ExplainPreviewViewModel"
        updatedAt:
          type: string
          format: date-time
    RulePreviewBusinessRequest:
      type: object
      required: [rule]
      properties:
        rule:
          $ref: "#/components/schemas/UiRuleViewModel"
        explainOverrides:
          type: object
          additionalProperties:
            type: string
    RulePreviewBusinessResult:
      type: object
      required: [valid, errors]
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: string
        explain:
          $ref: "#/components/schemas/ExplainPreviewViewModel"
        antiPatterns:
          $ref: "#/components/schemas/AntiPatternReport"
        generatedGql:
          type: string
          nullable: true
          description: Preview-only GQL string. Not persisted or executed.
    RuleUpdateBusinessRequest:
      type: object
      required: [rule]
      properties:
        rule:
          $ref: "#/components/schemas/UiRuleViewModel"
        explainOverrides:
          type: object
          additionalProperties:
            type: string
        updatedBy:
          type: string
          nullable: true
    TopicSubmitReviewBusinessRequest:
      type: object
      properties:
        submittedBy:
          type: string
          nullable: true
        comment:
          type: string
          nullable: true
    TopicSubmitReviewRequest:
      type: object
      properties:
        submittedBy:
          type: string
          nullable: true
        comment:
          type: string
          nullable: true
    TopicSubmitReviewResponse:
      type: object
      required: [reviewId, revision, status, submittedAt]
      properties:
        reviewId:
          type: integer
        revision:
          type: integer
        status:
          type: string
        submittedAt:
          type: string
          format: date-time
    TopicReviewDetailResponse:
      type: object
      required: [revision, rule, explain, status, submittedAt]
      properties:
        revision:
          type: integer
        rule:
          $ref: "#/components/schemas/UiRuleViewModel"
        capability:
          $ref: "#/components/schemas/UiCapabilityViewModel"
        explain:
          $ref: "#/components/schemas/ExplainPreviewViewModel"
        gql:
          type: string
          nullable: true
        status:
          type: string
        submittedBy:
          type: string
          nullable: true
        submittedAt:
          type: string
          format: date-time
        reviewedBy:
          type: string
          nullable: true
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        reviewComment:
          type: string
          nullable: true
    TopicPublishRequest:
      type: object
      properties:
        sourceRevision:
          type: integer
          nullable: true
        publisher:
          type: string
          nullable: true
        expectedHash:
          type: string
          nullable: true
    TopicPublishResponse:
      type: object
      required: [publishedRevision, publishedAt]
      properties:
        publishedRevision:
          type: integer
        publishedAt:
          type: string
          format: date-time
    TopicPublishedResponse:
      type: object
      required: [revision, rule, explain, publishedAt]
      properties:
        revision:
          type: integer
        rule:
          $ref: "#/components/schemas/UiRuleViewModel"
        capability:
          $ref: "#/components/schemas/UiCapabilityViewModel"
        explain:
          $ref: "#/components/schemas/ExplainPreviewViewModel"
        gql:
          type: string
          nullable: true
        publishedBy:
          type: string
          nullable: true
        publishedAt:
          type: string
          format: date-time
    TopicResponse:
      type: object
      required: [id, topic_id, name, status]
      properties:
        id:
          type: string
        topic_id:
          type: string
        name:
          type: string
        status:
          type: string
    TopicListItem:
      type: object
      required: [id, topic_id, name, status, usedBy, updatedAt]
      properties:
        id:
          type: string
        topic_id:
          type: string
        name:
          type: string
        status:
          type: string
        usedBy:
          type: array
          items:
            type: string
        updatedAt:
          type: string
          format: date-time
    RuleCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        rule:
          $ref: "#/components/schemas/UiRuleViewModel"
        createdBy:
          type: string
          nullable: true
    RuleCreateResponse:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        status:
          type: string
    RuleTemplateCreateRequest:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
        description:
          type: string
        category:
          type: string
          nullable: true
        createdBy:
          type: string
          nullable: true
    RuleTemplateCreateResponse:
      type: object
      required: [id, status]
      properties:
