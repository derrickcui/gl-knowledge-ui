components:
  schemas:
    SearchMode:
      type: string
      enum: [LEXICAL, VECTOR, HYBRID]
      description: Search mode

    SearchRequest:
      type: object
      required: [query, mode]
      properties:
        query:
          type: string
          description: User query text
          example: äººæ‰è¡¥è´´
        page:
          type: integer
          minimum: 1
          default: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
        mode:
          $ref: '#/components/schemas/SearchMode'
        filters:
          type: array
          description: Business filters (structure follows backend DSL)
          items:
            type: object
            additionalProperties: true
        sorts:
          type: array
          items:
            type: object
            additionalProperties: true
        returnFields:
          type: array
          items:
            type: string
        highlight:
          type: object
          additionalProperties: true
        facets:
          type: object
          additionalProperties: true
        hybrid:
          type: object
          additionalProperties: true
        topicId:
          type: string
          nullable: true
          description: |
            Optional topic runtime ID (manual topic filter mode).
            Current phase only supports `mode=LEXICAL` when this field is present.
        activeTopicIds:
          type: array
          nullable: true
          description: Optional active topics for doc-level topic signal evaluation (LEXICAL/HYBRID).
          items:
            type: string
        rankingExperimentId:
          type: string
          nullable: true
          description: |
            Optional ranking experiment override ID.
            Used to switch ranking feature set / fusion strategy for online gray release and A/B validation.
          example: linear-rank-no-topic
        topicRankingEnabled:
          type: boolean
          nullable: true
          description: Optional toggle for topic-related ranking features and topic boost.
        topicMatchWeightOverride:
          type: number
          format: double
          nullable: true
          description: Optional request-level override for topic match weight.
        topicWeightWeightOverride:
          type: number
          format: double
          nullable: true
          description: Optional request-level override for topic weight feature weight.

    TopicEntrySearchRequest:
      type: object
      description: |
        Request body for topic entry endpoint. `query` is optional because topic itself becomes primary query.
      properties:
        query:
          type: string
          nullable: true
          description: Optional user query text. Topic entry can work without it.
        page:
          type: integer
          minimum: 1
          default: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
        mode:
          $ref: '#/components/schemas/SearchMode'
        filters:
          type: array
          items:
            type: object
            additionalProperties: true
        sorts:
          type: array
          items:
            type: object
            additionalProperties: true
        returnFields:
          type: array
          items:
            type: string
        highlight:
          type: object
          additionalProperties: true
        facets:
          type: object
          additionalProperties: true
        hybrid:
          type: object
          additionalProperties: true

    TopicEvaluateDocRequest:
      type: object
      required: [topicId]
      properties:
        topicId:
          type: string
          description: Topic runtime ID
        dataset:
          type: string
          nullable: true
          description: Optional dataset hint used to resolve topic runtime binding
        title:
          type: string
          nullable: true
        content:
          type: string
          nullable: true
        summary:
          type: string
          nullable: true
        fields:
          type: object
          nullable: true
          additionalProperties: true
        includeStructure:
          type: boolean
          default: true
        includeExplain:
          type: boolean
          default: false

    TopicEvaluateDocByIdRequest:
      type: object
      required: [topicId, docId]
      properties:
        topicId:
          type: string
          description: Topic runtime ID
        docId:
          type: string
          description: Document ID
        dataset:
          type: string
          nullable: true
          description: Optional dataset hint used to resolve topic runtime binding
        includeStructure:
          type: boolean
          default: true
        includeExplain:
          type: boolean
          default: false

    TopicDocEvaluationExplainNode:
      type: object
      properties:
        nodeId:
          type: string
          nullable: true
        label:
          type: string
          nullable: true
        matched:
          type: boolean

    TopicDocEvaluationResponse:
      type: object
      properties:
        topicId:
          type: string
        topicName:
          type: string
          nullable: true
        dataset:
          type: string
          nullable: true
        docId:
          type: string
          nullable: true
        matched:
          type: boolean
        matchedNodeIds:
          type: array
          items:
            type: string
        matchedTerms:
          type: array
          items:
            type: string
        evaluationSources:
          type: array
          items:
            type: string
        appliedModes:
          type: array
          items:
            type: string
        reason:
          type: string
          nullable: true
        explain:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/TopicDocEvaluationExplainNode'

    SearchResponse:
      type: object
      properties:
        totalHits:
          type: integer
          format: int64
        page:
          type: integer
        size:
          type: integer
        hits:
          type: array
          items:
            $ref: '#/components/schemas/SearchHit'
        facets:
          type: object
          additionalProperties:
            type: object
            additionalProperties: true
        quality:
          $ref: '#/components/schemas/SearchQuality'
        debug:
          type: object
          description: |
            Debug/observability fields. Keys are dynamic.
            May include:
            - `topic`
            - `queryPipeline`
            - `rewrite` (only when `search.rewrite.debug.enabled=true`)
            - `queryAttributes`
            - `rankingConfig`
            - `rankingResolved`
            - `topicIntent`
            - `topicGrouping`
          additionalProperties: true
        query:
          type: object
          description: Query intelligence attributes (dynamic object)
          additionalProperties: true

    SearchHit:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        summary:
          type: string
        fields:
          type: object
          additionalProperties: true
        highlights:
          type: object
          additionalProperties:
            type: string
        score:
          type: number
          format: float
        lexicalScore:
          type: number
          format: float
        vectorScore:
          type: number
          format: float
        rankExplain:
          type: object
          additionalProperties: true
        scoreBreakdown:
          $ref: '#/components/schemas/ScoreBreakdownView'
        topicSignals:
          type: array
          items:
            $ref: '#/components/schemas/TopicSignalRuntimeView'
        topicLabels:
          type: array
          description: Topic labels derived from matched topic signals for display grouping/tagging.
          items:
            type: string
        aiSummary:
          type: object
          nullable: true
          additionalProperties: true

    SearchQuality:
      type: object
      description: Search quality/debug scoring metadata
      properties:
        hybridEnabled:
          type: boolean
        lexicalWeight:
          type: number
          format: double
        vectorWeight:
          type: number
          format: double
        dynamicWeightApplied:
          deprecated: true
          type: boolean
          description: Deprecated placeholder; actual runtime schema currently uses `rerankApplied`.
        rerankApplied:
          type: boolean
        rankingLatencyMs:
          type: integer
          format: int64
      additionalProperties: true

    ErrorResponse:
      type: object
      description: Generic Spring error response (simplified)
      additionalProperties: true

    TopicRuntimeApiResponse:
      type: object
      properties:
        version:
          type: integer
          format: int32
        topics:
          type: array
          items:
            $ref: '#/components/schemas/TopicRuntimeApiItem'

    TopicRuntimeApiItem:
      type: object
      properties:
        topicId:
          type: string
        topicName:
          type: string
        compiledGql:
          type: string
        datasetName:
          type: string
          nullable: true
        deployMode:
          type: array
          items:
            type: string
        weight:
          type: integer
          format: int32
        namespace:
          type: string

    TopicSetCoverageResponse:
      type: object
      properties:
        version:
          type: integer
          format: int32
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/TopicSetCoverageNodeView'

    TopicSetCoverageNodeView:
      type: object
      properties:
        nodeId:
          type: string
        name:
          type: string
          nullable: true
        docCount:
          type: integer
          format: int64

    TopicSetDistributionItem:
      type: object
      required: [topicId, topicName, docCount, nodeCount, nodeIds]
      properties:
        topicId:
          type: string
        topicName:
          type: string
        docCount:
          type: integer
          format: int64
        nodeCount:
          type: integer
          format: int32
        nodeIds:
          type: array
          items:
            type: string

    TopicSetDistributionResponse:
      type: object
      required: [version, topicSetId, dedup, totalTopics, items]
      properties:
        version:
