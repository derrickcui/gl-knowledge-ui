openapi: 3.0.3
info:
  title: Search Service API (Search)
  version: "1.0.0"
  description: |
    Search API contract focused on `/api/search` endpoints.

    Recent changes:
    - `POST /api/search` supports optional `topicId` (manual topic filter).
    - Added `POST /api/search/topic/{topicId}` for topic-entry search.
    - Response `debug` may include `topic`, `queryPipeline`, and (optionally) `rewrite`.

servers:
  - url: http://localhost:8081
    description: Local search service

tags:
  - name: search
    description: Search endpoints
  - name: topicset-search
    description: Search-side TopicSet runtime endpoints
  - name: topic
    description: Topic rule evaluation endpoints
  - name: suggest
    description: Suggest endpoints
  - name: retrieval
    description: RAG retrieval endpoints
  - name: docview
    description: Document view endpoints
  - name: governance-internal
    description: Internal / embedded reference governance endpoints (non-production)

paths:
  /api/runtime/search-topics:
    get:
      tags: [search]
      summary: List in-memory available search topics
      description: |
        Returns the topic runtime currently loaded in Search Service memory (`TopicRuntimeCache`).

        If `datasetName` is provided, the response includes:
        - topics for that dataset
        - global topics (`datasetName = null`)
      operationId: getRuntimeSearchTopics
      parameters:
        - name: datasetName
          in: query
          required: false
          schema:
            type: string
          description: Optional dataset name to filter available topics (global topics are included as fallback)
      responses:
        "200":
          description: Runtime topics loaded in memory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicRuntimeApiResponse'
              examples:
                allTopics:
                  value:
                    version: 2
                    topics:
                      - topicId: topic-0118e8a7-f328-4443-a654-1af67f038abd
                        topicName: æµ‹è¯•æƒé‡
                        compiledGql: "<and>([6.0] å‡ºç«™åšå£«åŽ, [3.0] <or>(åŒºäººæ‰æœåŠ¡ä¸­å¿ƒæˆšè€å¸ˆ, ä¸­é’å¹´ä¸“ä¸šæŠ€æœ¯äººæ‰))"
                        datasetName: null
                        deployMode: [FILTER]
                        weight: 10
                        namespace: policy
                      - topicId: topic-45c09288-bcfc-406d-8c5b-4668f86e76b2
                        topicName: testHeader
                        compiledGql: åŒºçº§äººåŠ›ç¤¾ä¿éƒ¨é—¨
                        datasetName: gl_demo
                        deployMode: [FILTER, BOOST, LABEL, MAP, SIGNAL]
                        weight: 1
                        namespace: policy

  /api/topicsets/{id}/coverage:
    get:
      tags: [topicset-search]
      summary: Real-time TopicSet node coverage
      operationId: topicSetCoverage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: dedup
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: When true, counts each node with one OR expression to avoid double-counting documents matched by multiple topics under the same node
      responses:
        "200":
          description: Coverage loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeTopicSetCoverage'
              examples:
                summedCoverage:
                  summary: `dedup=false` topic count summed by node
                  value:
                    success: true
                    data:
                      version: 5
                      nodes:
                        - nodeId: node-a
                          name: 博士
                          docCount: 14
                        - nodeId: node-b
                          name: 企业
                          docCount: 4
                    error: null
                dedupCoverage:
                  summary: `dedup=true` node-level OR count without duplicate documents
                  value:
                    success: true
                    data:
                      version: 5
                      nodes:
                        - nodeId: node-a
                          name: 博士
                          docCount: 11
                        - nodeId: node-b
                          name: 企业
                          docCount: 4
                    error: null
        "400":
          description: Invalid topicSet id, dataset mismatch, or invalid runtime binding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidUuid:
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: "Method parameter 'id': Failed to convert value of type 'java.lang.String' to required type 'java.util.UUID'; Invalid UUID string: not-a-uuid"
                datasetMismatch:
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: topicset runtime dataset mismatch: expected gl_demo, got other_collection
        "502":
          description: Failed to fetch or execute runtime-backed coverage query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                runtimeFetchFailed:
                  value:
                    type: about:blank
                    title: Bad Gateway
                    status: 502
                    detail: failed to fetch topicset runtime

  /api/topicsets/{id}/distribution:
    get:
      tags: [topicset-search]
      summary: Real-time topic distribution for one TopicSet
      operationId: topicSetDistribution
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: dedup
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: When false, uses batched facet counting for fast distribution stats; when true, switches to precise per-topic counting under the same TopicSet runtime
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 50
            minimum: 1
            maximum: 500
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [docCount, topicName]
            default: docCount
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Topic distribution loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeTopicSetDistribution'
              examples:
                distribution:
                  value:
                    success: true
                    data:
                      version: 5
                      topicSetId: 4257e57e-a1c9-4b76-b880-e487560f382c
                      dedup: false
                      totalTopics: 3
                      items:
                        - topicId: topic-1
                          topicName: 博士后政策
                          docCount: 80
                          nodeCount: 2
                          nodeIds: [node-a, node-b]
                        - topicId: topic-2
                          topicName: 高层次人才
                          docCount: 40
                          nodeCount: 1
                          nodeIds: [node-c]
                        - topicId: topic-3
                          topicName: 企业补贴
                          docCount: 20
                          nodeCount: 1
                          nodeIds: [node-d]
                    error: null
        "400":
          description: Invalid request or dataset mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidUuid:
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: "Invalid UUID string: not-a-uuid"
                datasetMismatch:
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: topicset runtime dataset mismatch
        "502":
          description: Failed to fetch runtime or execute distribution query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                runtimeFetchFailed:
                  value:
                    type: about:blank
                    title: Bad Gateway
                    status: 502
                    detail: failed to fetch topicset runtime

  /api/topicsets/{id}/nodes/{nodeId}/impact:
    get:
      tags: [topicset-search]
      summary: Real-time impacted documents for one TopicSet node
      operationId: topicSetNodeImpact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: nodeId
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [score, updatedAt, publishedAt]
            default: score
      responses:
        "200":
          description: Impact docs loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeTopicSetDocumentPage'
              examples:
                impactDocs:
                  value:
                    success: true
                    data:
                      page: 0
                      size: 20
                      total: 2
                      items:
                        - docId: doc-1
                          title: 人才政策通知
                          summary: "<em>人才</em>政策片段"
                          highlightFragments:
                            - "<em>人才</em>政策片段"
                        - docId: doc-2
                          title: 博士后支持办法
                          summary: 面向博士后的人才支持政策摘要
                          highlightFragments: []
                    error: null
        "400":
          description: Invalid request or dataset mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                datasetMismatch:
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: topicset runtime dataset mismatch: expected gl_demo, got other_collection
        "404":
          description: TopicSet node not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                nodeNotFound:
                  value:
                    type: about:blank
                    title: Not Found
                    status: 404
                    detail: topicset node not found: node-a
        "502":
          description: Failed to fetch runtime or execute Solr query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                runtimeFetchFailed:
                  value:
                    type: about:blank
                    title: Bad Gateway
                    status: 502
                    detail: failed to fetch topicset runtime

  /api/topicsets/{id}/nodes/{nodeId}/distribution:
    get:
      tags: [topicset-search]
      summary: Real-time topic distribution for one TopicSet node
