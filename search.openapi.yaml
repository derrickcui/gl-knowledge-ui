          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: nodeId
          in: path
          required: true
          schema:
            type: string
        - name: dedup
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: When false, uses batched facet counting for fast node-scoped distribution stats; when true, switches to precise per-topic counting under the same TopicSet runtime
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 50
            minimum: 1
            maximum: 500
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [docCount, topicName]
            default: docCount
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
