  /internal/topicsets/{id}/runtime-cache/refresh:
    post:
      tags: [topicset-search]
      summary: Refresh cached TopicSet runtime in Search Service
      operationId: refreshTopicSetRuntimeCache
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Runtime cache refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeTopicSetRuntimeCacheRefresh'
              examples:
                refreshed:
                  value:
                    success: true
                    data:
                      topicSetId: 4257e57e-a1c9-4b76-b880-e487560f382c
                      version: 7
                      refreshedAt: "2026-03-06T12:00:00Z"
                    error: null
        "400":
          description: Invalid topicSet id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidUuid:
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: "Method parameter 'id': Failed to convert value of type 'java.lang.String' to required type 'java.util.UUID'; Invalid UUID string: not-a-uuid"
        "502":
          description: Failed to fetch latest runtime from Rule Service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                runtimeFetchFailed:
                  value:
                    type: about:blank
                    title: Bad Gateway
                    status: 502
                    detail: failed to fetch topicset runtime

  /api/topic/evaluate-doc:
    post:
      tags: [topic]
      summary: Evaluate topic match on input document text
      description: |
        Runs doc-level topic evaluation (`DocTopicEvaluationService`) against the provided text payload.
        This endpoint is intended for topic rule debugging/review and UI semantic labeling.
      operationId: evaluateTopicDoc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopicEvaluateDocRequest'
            examples:
              evaluateDocBasic:
                value:
                  topicId: topic-1
                  dataset: gl_demo
                  title: 博士后人才补贴通知
                  content: 出站博士后可申请人才补贴
                  includeStructure: true
                  includeExplain: true
      responses:
        "200":
          description: Evaluation success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicDocEvaluationResponse'
        "400":
          description: Invalid request / topic runtime not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/topic/evaluate-doc-by-id:
    post:
      tags: [topic]
      summary: Evaluate topic match by document id
      description: |
        Loads document by `docId` then runs doc-level topic evaluation.
        Useful for checking whether a specific stored document matches a topic rule.
      operationId: evaluateTopicDocById
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopicEvaluateDocByIdRequest'
            examples:
              evaluateDocByIdBasic:
                value:
                  topicId: topic-1
                  docId: doc-123
                  dataset: gl_demo
      responses:
        "200":
          description: Evaluation success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicDocEvaluationResponse'
        "400":
          description: Invalid request / topic runtime not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/search:
    post:
      tags: [search]
      summary: Unified search
      description: |
        Main search entry.

        Notes:
        - `topicId` is optional. When provided, current phase only supports `mode=LEXICAL`.
        - `topicId` is applied as topic filter (`fq={!geelink}<compiledGql>`).
      operationId: search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
            examples:
              lexicalBasic:
                summary: Basic lexical search
                value:
                  query: äººæ‰è¡¥è´´
                  page: 1
                  size: 10
                  mode: LEXICAL
              lexicalWithTopic:
                summary: Lexical search with manual topic filter
                value:
                  query: äººæ‰è¡¥è´´
                  page: 1
                  size: 10
                  mode: LEXICAL
                  topicId: topic-45c09288-bcfc-406d-8c5b-4668f86e76b2
              lexicalWithRankingExperiment:
                summary: Lexical search with ranking experiment override
                value:
                  query: ranking test
                  page: 1
                  size: 10
                  mode: LEXICAL
                  rankingExperimentId: linear-rank-no-topic
              lexicalWithTopicRankingOverride:
                summary: Lexical search with explicit topic ranking controls
                value:
                  query: 人才补贴
                  page: 1
                  size: 10
                  mode: LEXICAL
                  topicRankingEnabled: true
                  topicMatchWeightOverride: 0.15
                  topicWeightWeightOverride: 0.05
