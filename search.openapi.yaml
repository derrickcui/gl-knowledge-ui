  /api/search/topic/{topicId}:
    post:
      tags: [search]
      summary: Topic entry search
      description: |
        Topic entry endpoint. Topic is applied as primary query (`q={!geelink}<compiledGql>`).

        Notes:
        - `topicId` comes from path parameter.
        - Request body is optional.
        - Current phase is intended for lexical search behavior.
      operationId: searchByTopic
      parameters:
        - name: topicId
          in: path
          required: true
          schema:
            type: string
          description: Topic runtime ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopicEntrySearchRequest'
            examples:
              topicEntryDefault:
                summary: Body omitted or minimal body
                value:
                  page: 1
                  size: 10
                  mode: LEXICAL
              topicEntryWithFilters:
                summary: Topic entry with additional business filters
                value:
                  page: 1
                  size: 10
                  mode: LEXICAL
                  filters:
                    - field: source
                      values: [policy]
      responses:
        "200":
          description: Topic entry search success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
              examples:
                topicEntryDebug:
                  summary: Topic entry response with debug
                  value:
                    totalHits: 5
                    page: 1
                    size: 10
                    hits: []
                    facets: {}
                    quality:
                      hybridEnabled: false
                      lexicalWeight: 1
                      vectorWeight: 0
                      rerankApplied: false
                      rankingLatencyMs: 12
                    debug:
                      topic:
                        requested: true
                        applied: true
                        topicId: topic-45c09288-bcfc-406d-8c5b-4668f86e76b2
                        dataset: gl_demo
                        mode: ENTRY
                        solrTarget: q
                        solrInjected: "{!geelink}åŒºçº§äººåŠ›ç¤¾ä¿éƒ¨é—¨"
                        reason: APPLIED
                      queryPipeline:
                        topicEntry:
                          requested: true
                          applied: true
                          topicId: topic-45c09288-bcfc-406d-8c5b-4668f86e76b2
