          format: int32
        logicCount:
          type: integer
          format: int32
        operatorCount:
          type: integer
          format: int32
        proximityCount:
          type: integer
          format: int32
        logicDensity:
          type: number
          format: double
        complexityScore:
          type: integer
          format: int32
      required: [depth, clauseCount, logicCount, operatorCount, proximityCount, logicDensity, complexityScore]

    RuleVersionListItem:
