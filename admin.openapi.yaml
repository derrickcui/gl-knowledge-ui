              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /api/simulation/topicset/{topicSetId}:
    post:
      tags: [TopicSimulation]
      summary: Simulate topicset coverage
      operationId: simulateTopicSet
      parameters:
        - name: topicSetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulationTopicSetRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTopicSetSimulationResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /api/runtime/deploy:
    post:
      tags: [Runtime]
      summary: Create runtime snapshot and deployment record
      operationId: createRuntimeDeploy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeDeployRequest'
            example:
              topicId: TALENT_POLICY
              environmentId: 3
              activate: true
              operator: admin
              deployMode: [FILTER, BOOST, LABEL]
              weight: 10
              namespace: policy
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRuntimeDeployResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /api/runtime/deploy/{deploymentId}/activate:
    post:
      tags: [Runtime]
      summary: Activate an existing runtime deployment
      operationId: activateRuntimeDeployment
      parameters:
        - name: deploymentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeTransitionRequest'
            example:
              operator: admin
              verifyExecution: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
