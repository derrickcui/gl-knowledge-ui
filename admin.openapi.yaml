            type: string
            format: uuid
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopicSetLifecycleRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTopicSetLifecycleResponse'

  /api/topicsets/{id}/archive:
    post:
      tags: [TopicSet]
      summary: Archive TopicSet
      operationId: archiveTopicSet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopicSetLifecycleRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTopicSetLifecycleResponse'

  /api/topicsets/{id}/versions/{version}/nodes:
    get:
      tags: [TopicSet]
      summary: List nodes in a specific version
      operationId: listTopicSetVersionNodes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: version
          in: path
          required: true
          schema:
            type: integer
            format: int32
        - name: parentId
          in: query
          required: false
          schema:
            type: string
            format: uuid
            nullable: true
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 500
            default: 100
        - name: includeStats
          in: query
          required: false
          schema:
            type: boolean
        - name: updatedSince
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTopicSetNodeListResponse'
        '304':
          description: Not Modified

  /api/topicsets/{id}/versions/{version}/tree:
    get:
      tags: [TopicSet]
      summary: Get version tree
      operationId: getTopicSetVersionTree
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: version
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseNodeTreeResponse'

components:
  schemas:
    RuntimeActiveItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        datasetName:
          type: string
        scopeLabel:
          type: string
      required: [id, name, datasetName, scopeLabel]

    RulePreviewRequest:
      type: object
      properties:
        ruleJson:
          type: object
          additionalProperties: true
        runtimeEnvironmentId:
          type: integer
          format: int64
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
      required: [ruleJson, runtimeEnvironmentId]

    NodePreviewRequest:
      type: object
      properties:
        ruleJson:
          type: object
          additionalProperties: true
        nodeId:
          type: string
        runtimeEnvironmentId:
          type: integer
          format: int64
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
      required: [ruleJson, nodeId, runtimeEnvironmentId]

    RuleRuntimeExecuteRequest:
      oneOf:
        - $ref: '#/components/schemas/RuleRuntimeExecuteFullRequest'
        - $ref: '#/components/schemas/RuleRuntimeExecuteNodeRequest'
        - $ref: '#/components/schemas/RuleRuntimeExecuteImpactRequest'
      discriminator:
        propertyName: mode
        mapping:
          FULL: '#/components/schemas/RuleRuntimeExecuteFullRequest'
          NODE: '#/components/schemas/RuleRuntimeExecuteNodeRequest'
          IMPACT: '#/components/schemas/RuleRuntimeExecuteImpactRequest'

    RuleRuntimeExecuteFullRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [FULL]
        runtimeEnvironmentId:
          type: integer
          format: int64
        rule:
          $ref: '#/components/schemas/UiRuleViewModel'
        options:
          $ref: '#/components/schemas/RuleRuntimeExecuteOptions'
      required: [mode, runtimeEnvironmentId, rule]

    RuleRuntimeExecuteNodeRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [NODE]
        runtimeEnvironmentId:
          type: integer
          format: int64
        rule:
          $ref: '#/components/schemas/UiRuleViewModel'
        nodeId:
          type: string
        options:
          $ref: '#/components/schemas/RuleRuntimeExecuteOptions'
      required: [mode, runtimeEnvironmentId, rule, nodeId]

    RuleRuntimeExecuteImpactRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [IMPACT]
        runtimeEnvironmentId:
          type: integer
          format: int64
        rule:
          $ref: '#/components/schemas/UiRuleViewModel'
        options:
          $ref: '#/components/schemas/RuleRuntimeExecuteImpactOptions'
      required: [mode, runtimeEnvironmentId, rule]

    RuleRuntimeExecuteOptions:
      type: object
      properties:
        page:
          type: integer
          format: int32
          minimum: 1
          default: 1
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
        withHighlight:
          type: boolean
          default: true
        withItems:
          type: boolean
          default: true

    RuleRuntimeExecuteImpactOptions:
      type: object
      properties:
        withHighlight:
          type: boolean
          enum: [false]
          default: false
        withItems:
          type: boolean
          enum: [false]
          default: false

    RuleRuntimeExecuteAnalysisRequest:
      type: object
      properties:
        runtimeEnvironmentId:
          type: integer
          format: int64
        rule:
          $ref: '#/components/schemas/UiRuleViewModel'
        options:
          $ref: '#/components/schemas/RuleRuntimeExecuteAnalysisOptions'
      required: [runtimeEnvironmentId, rule]

    RuleRuntimeExecuteAnalysisOptions:
      type: object
      properties:
        bucketSizePercent:
          type: integer
          format: int32
          minimum: 1
          maximum: 50
          default: 10

    RuleRuntimeExecuteAnalysisResponse:
      type: object
      properties:
        mode:
          type: string
          enum: [ANALYSIS]
        runtimeEnvironmentId:
          type: integer
          format: int64
        datasetTotal:
          type: integer
          format: int64
        ruleHit:
          type: integer
          format: int64
        hitRate:
          type: number
          format: double
        termStats:
          type: array
          items:
            $ref: '#/components/schemas/RuleRuntimeExecuteTermStat'
        nodeStats:
          type: array
          items:
            $ref: '#/components/schemas/RuleRuntimeExecuteNodeStat'
        distribution:
          type: object
          additionalProperties:
            type: integer
            format: int64
          example:
            0-10%: 2
            10-20%: 4
            20-30%: 6
        took:
          type: integer
          format: int64
        metadata:
          $ref: '#/components/schemas/RuntimeExecuteMetadata'
      required: [mode, runtimeEnvironmentId, datasetTotal, ruleHit, hitRate, termStats, nodeStats, distribution, took, metadata]

    RuleRuntimeExecuteTermStat:
      type: object
      properties:
        termId:
          type: string
        nodeId:
          type: string
          nullable: true
        hitCount:
          type: integer
          format: int64
        hitRate:
          type: number
          format: double
      required: [termId, hitCount, hitRate]

    RuleRuntimeExecuteNodeStat:
      type: object
      properties:
        nodeId:
          type: string
          nullable: true
        nodeType:
          type: string
        hitCount:
          type: integer
          format: int64
        contribution:
          type: number
          format: double
      required: [nodeType, hitCount, contribution]

    RuleRuntimeCompareRequest:
      type: object
      properties:
        runtimeEnvironmentId:
          type: integer
          format: int64
        ruleA:
          $ref: '#/components/schemas/UiRuleViewModel'
        ruleB:
          $ref: '#/components/schemas/UiRuleViewModel'
      required: [runtimeEnvironmentId, ruleA, ruleB]

    RuleRuntimeCompareResponse:
      type: object
      properties:
        mode:
          type: string
          enum: [COMPARE]
        runtimeEnvironmentId:
          type: integer
          format: int64
        ruleAHit:
          type: integer
          format: int64
        ruleBHit:
          type: integer
          format: int64
        overlap:
          type: integer
          format: int64
        onlyA:
          type: integer
          format: int64
        onlyB:
          type: integer
          format: int64
        took:
          type: integer
          format: int64
        metadata:
          $ref: '#/components/schemas/RuntimeExecuteMetadata'
      required: [mode, runtimeEnvironmentId, ruleAHit, ruleBHit, overlap, onlyA, onlyB, took, metadata]

    RuleRuntimeSuggestRequest:
      type: object
      properties:
        runtimeEnvironmentId:
          type: integer
          format: int64
        rule:
          $ref: '#/components/schemas/UiRuleViewModel'
        options:
          $ref: '#/components/schemas/RuleRuntimeSuggestOptions'
      required: [runtimeEnvironmentId, rule]

    RuleRuntimeSuggestOptions:
      type: object
      properties:
        lowContributionThreshold:
          type: number
          format: double
          default: 0.05
        maxSuggestions:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20

    RuleRuntimeSuggestion:
      type: object
      properties:
        type:
          type: string
        nodeId:
          type: string
          nullable: true
        termId:
          type: string
          nullable: true
        message:
          type: string
        score:
          type: number
          format: double
      required: [type, message, score]

    RuleRuntimeSuggestResponse:
      type: object
      properties:
        mode:
          type: string
          enum: [SUGGEST]
        runtimeEnvironmentId:
          type: integer
          format: int64
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/RuleRuntimeSuggestion'
        took:
          type: integer
          format: int64
        metadata:
          $ref: '#/components/schemas/RuntimeExecuteMetadata'
      required: [mode, runtimeEnvironmentId, suggestions, took, metadata]

    RuleRuntimeRiskRequest:
      type: object
      properties:
        runtimeEnvironmentId:
          type: integer
          format: int64
        rule:
          $ref: '#/components/schemas/UiRuleViewModel'
        options:
          $ref: '#/components/schemas/RuleRuntimeRiskOptions'
      required: [runtimeEnvironmentId, rule]

    RuleRuntimeRiskOptions:
      type: object
      properties:
        slowExecutionMs:
          type: integer
          format: int64
          default: 2000

    RuleRuntimeRiskResponse:
      type: object
      properties:
        mode:
          type: string
          enum: [RISK]
        runtimeEnvironmentId:
          type: integer
          format: int64
        riskLevel:
          type: string
          enum: [LOW, MEDIUM, HIGH]
        riskScore:
          type: integer
          format: int32
        riskFactors:
          type: array
          items:
            type: string
        clauseCount:
          type: integer
          format: int32
        maxDepth:
          type: integer
          format: int32
        complexityScore:
          type: integer
          format: int32
        hitRate:
          type: number
          format: double
        executeTime:
          type: integer
          format: int64
        took:
          type: integer
          format: int64
        metadata:
          $ref: '#/components/schemas/RuntimeExecuteMetadata'
      required: [mode, runtimeEnvironmentId, riskLevel, riskScore, riskFactors, clauseCount, maxDepth, complexityScore, hitRate, executeTime, took, metadata]

    RuleAnalyzeRequest:
      type: object
      properties:
        rule_json:
          $ref: '#/components/schemas/UiRuleViewModel'
      required: [rule_json]

    RuleAnalyzeResponse:
      type: object
