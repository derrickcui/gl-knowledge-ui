      type: object
      properties:
        withHighlight:
          type: boolean
          enum: [false]
          default: false
        withItems:
          type: boolean
          enum: [false]
          default: false

    RuleRuntimeExecuteAnalysisRequest:
      type: object
      properties:
        runtimeEnvironmentId:
          type: integer
          format: int64
        rule:
