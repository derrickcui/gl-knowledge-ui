openapi: 3.0.3
info:
  title: RuleOps Rule Preview API
  version: 2.2.0
  description: |
    APIs for in-memory rule editing, full preview, and node-level preview.

    Frontend breaking-change scope (rule weight support):
    - Added `BOOST` expression node (`type=BOOST`, fields: `weight`, `child`)
    - Added `terms[].weight` in `TERM_SET`

    Frontend must update request/response parsing for these APIs:
    - POST `/api/rules/analyze`
    - GET `/api/rules/{id}/version/{v}`
    - POST `/api/rules/runtime/execute`
    - POST `/api/rules/runtime/execute/analysis`
    - POST `/api/rules/runtime/compare`
    - POST `/api/rules/runtime/suggest`
    - POST `/api/rules/runtime/risk`
    - GET `/api/topics/{topicId}/reviews/{revision}`
servers:
  - url: http://localhost:8080

tags:
  - name: Runtime
    description: Runtime environment selection for preview
  - name: RulePreview
    description: Rule preview and preview document detail
  - name: RuleGovernance
    description: Rule analysis and version governance APIs
  - name: Tagging
    description: Topic tagging job management APIs
  - name: Analytics
    description: Semantic analytics APIs
  - name: TopicSet
    description: TopicSet governance APIs
  - name: TopicSimulation
    description: Topic rule compile and simulation APIs

paths:
  /api/runtime/active:
    get:
      tags: [Runtime]
      summary: List active runtime environments
      operationId: listActiveRuntimeEnvironments
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RuntimeActiveItem'

  /api/runtime/deploy/validate:
    post:
      tags: [Runtime]
      summary: Validate topic deployability on runtime environment
      operationId: validateRuntimeDeploy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeDeployValidateRequest'
            example:
              topicId: TALENT_POLICY
              environmentId: 3
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRuntimeDeployValidateResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /api/topics/preview-rule:
    post:
      tags: [TopicSimulation]
      summary: Compile topic rule with runtime field mapping
      operationId: previewTopicRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopicSimulationRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTopicPreviewRuleResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /api/topics/simulate:
    post:
      tags: [TopicSimulation]
      summary: Simulate topic rule through search service
      operationId: simulateTopicRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopicSimulationRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTopicSimulateResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /api/topics/simulate-impact:
    post:
      tags: [TopicSimulation]
      summary: Simulate topic impact through search service
      operationId: simulateTopicRuleImpact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopicSimulationRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTopicSimulateImpactResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /api/simulation/topic:
    post:
      tags: [TopicSimulation]
      summary: Simulate topic rule
      operationId: simulateTopic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulationTopicRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTopicSimulateResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /api/simulation/topic/{topicId}:
    post:
      tags: [TopicSimulation]
      summary: Simulate topic rule by topic id
      operationId: simulateTopicById
      parameters:
        - name: topicId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulationTopicRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTopicSimulateResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /api/simulation/topic/preview:
    post:
      tags: [TopicSimulation]
      summary: Preview compiled topic rule
      operationId: previewSimulationTopic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulationTopicRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTopicPreviewRuleResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /api/simulation/topic/{topicId}/preview:
    post:
      tags: [TopicSimulation]
      summary: Preview compiled topic rule by topic id
      operationId: previewSimulationTopicById
      parameters:
        - name: topicId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulationTopicRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTopicPreviewRuleResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /api/simulation/topic/{topicId}/impact:
    post:
      tags: [TopicSimulation]
      summary: Simulate topic impact by topic id
      operationId: simulateTopicImpactById
      parameters:
        - name: topicId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulationTopicRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTopicSimulateImpactResponse'
        '400':
          description: Validation error
          content:
