openapi: 3.0.3
info:
  title: RuleOps Rule Preview API
  version: 2.1.0
  description: APIs for in-memory rule editing, full preview, and node-level preview.
servers:
  - url: http://localhost:8080

tags:
  - name: Runtime
    description: Runtime environment selection for preview
  - name: RulePreview
    description: Rule preview and preview document detail

paths:
  /api/runtime/active:
    get:
      tags: [Runtime]
      summary: List active runtime environments
      operationId: listActiveRuntimeEnvironments
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RuntimeActiveItem'

  /api/rules/preview:
    post:
      tags: [RulePreview]
      deprecated: true
      summary: Execute full rule preview
      description: Deprecated. Use POST /api/rules/runtime/execute with mode=FULL.
      operationId: previewRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RulePreviewRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulePreviewResponse'
              example:
                mode: FULL
                nodeId: null
                total: 311
                previousTotal: null
                items: []
        '400':
          description: Validation or mapping error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Runtime environment unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/rules/preview/node:
    post:
      tags: [RulePreview]
      deprecated: true
      summary: Execute node subtree preview
      description: Deprecated. Use POST /api/rules/runtime/execute with mode=NODE.
      operationId: previewRuleNode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodePreviewRequest'
            example:
              ruleJson:
                root:
                  type: FIELD
                  field: CONTENT
                  child:
                    type: LOGIC
                    operator: AND
                    children: []
              nodeId: 848a3813-a382-421c-b1f2-4f5f86f09a2a
              runtimeEnvironmentId: 1
              limit: 20
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulePreviewResponse'
              example:
                mode: NODE
                nodeId: 848a3813-a382-421c-b1f2-4f5f86f09a2a
                total: 860
                previousTotal: null
                items: []
        '400':
          description: Validation or mapping error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Runtime environment or node unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '408':
          description: Execution timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/rules/runtime/execute:
    post:
      tags: [RulePreview]
      summary: Execute runtime rule in FULL, NODE or IMPACT mode
      description: Preferred unified runtime execution endpoint for preview and analysis. IMPACT mode enforces count-only analysis, max 15 conditions, and a server-side timeout guard.
      x-max-condition-count: 15
      x-impact-timeout-ms: 2000
      operationId: executeRuntimeRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleRuntimeExecuteRequest'
            examples:
              fullMode:
                summary: FULL mode request
                value:
                  mode: FULL
                  runtimeEnvironmentId: 1
                  rule:
                    root:
                      type: LOGIC
                      nodeId: root-1
                      operator: AND
                      children:
                        - type: FIELD
                          nodeId: field-1
                          field: CONTENT
                          child:
                            type: TERM_SET
                            nodeId: term-1
                            matchMode: ANY
                            terms:
                              - source: CONCEPT
                                conceptId: "20"
                                conceptName: 人才
                                includeDescendants: false
                    references: []
                  options:
                    page: 1
                    size: 20
                    withHighlight: true
                    withItems: true
              nodeMode:
                summary: NODE mode request
                value:
                  mode: NODE
                  runtimeEnvironmentId: 1
                  nodeId: term-1
                  rule:
                    root:
                      type: LOGIC
                      nodeId: root-1
                      operator: AND
                      children:
                        - type: FIELD
                          nodeId: field-1
                          field: CONTENT
                          child:
                            type: TERM_SET
                            nodeId: term-1
                            matchMode: ANY
                            terms:
                              - source: CONCEPT
                                conceptId: "20"
                                conceptName: 人才
                                includeDescendants: false
                    references: []
                  options:
                    page: 1
                    size: 20
                    withHighlight: true
                    withItems: true
              impactMode:
                summary: IMPACT mode request
                value:
                  mode: IMPACT
                  runtimeEnvironmentId: 1
                  rule:
                    root:
                      type: LOGIC
                      nodeId: root-1
                      operator: AND
                      children:
                        - type: TERM_SET
                          nodeId: term-1
                          matchMode: ANY
                          terms:
                            - source: CONCEPT
                              conceptId: "20"
                              conceptName: 博士
                              includeDescendants: false
                        - type: TERM_SET
                          nodeId: term-2
                          matchMode: ANY
                          terms:
                            - source: CONCEPT
                              conceptId: "36"
                              conceptName: 人力社保部门
                              includeDescendants: false
                    references: []
                  options:
                    withItems: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleRuntimeExecuteResponse'
              examples:
                fullMode:
                  summary: FULL mode response
                  value:
                    mode: FULL
                    runtimeEnvironmentId: 1
                    total: 311
                    page: 1
                    size: 20
                    took: 43
                    items:
                      - id: doc-1
                        title: 关于人才补贴政策
                        matchedReasons:
                          - field: DOC_TEXT
                            label: 正文
                            displayText: 正文包含“人才”
                            matchedTerms: [人才]
                        highlightFragments:
                          - "...符合<mark>人才</mark>补贴条件..."
                    metadata:
                      engineVersion: "1.0"
                      executionId: "d4be8a53-c283-4fd2-8a75-d5f88f6ab020"
                nodeMode:
                  summary: NODE mode response
                  value:
                    mode: NODE
                    runtimeEnvironmentId: 1
                    nodeId: term-1
                    page: 1
                    size: 20
                    fullTotal: 311
                    nodeTotal: 860
                    delta: 549
                    took: 65
                    items:
                      - id: doc-2
                        title: 2023年度领军人才项目
                        matchedReasons:
                          - field: DOC_TEXT
                            label: 正文
                            displayText: 正文包含“博士”
                            matchedTerms: [博士]
                        highlightFragments:
                          - "...出站<mark>博士</mark>后可申报..."
                    metadata:
                      engineVersion: "1.0"
                      executionId: "2fe20bf6-184f-4f3a-a05d-f7c83d39ce8b"
                impactMode:
                  summary: IMPACT mode response
                  value:
                    mode: IMPACT
                    runtimeEnvironmentId: 1
                    fullTotal: 311
                    conditionCount: 2
                    took: 210
                    analysis:
                      - nodeId: term-1
                        label: 博士
                        removedTotal: 720
                        contribution: 409
                        impactLevel: HIGH
                      - nodeId: term-2
                        label: 人力社保部门
                        removedTotal: 323
                        contribution: 12
                        impactLevel: LOW
                    metadata:
                      engineVersion: "1.0"
                      executionId: "9369a176-387e-43d8-bf28-f75f01386158"
        '400':
          description: Validation or mapping error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Runtime environment or node unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/rules/preview/document/{docId}:
    get:
      tags: [RulePreview]
      deprecated: true
      summary: Get preview document detail
      description: Deprecated legacy endpoint kept for compatibility.
      operationId: getPreviewDocumentDetail
      parameters:
        - name: docId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewDocumentDetailResponse'
        '404':
          description: Document not found in preview scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    RuntimeActiveItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        datasetName:
          type: string
        scopeLabel:
          type: string
      required: [id, name, datasetName, scopeLabel]

    RulePreviewRequest:
      type: object
      properties:
        ruleJson:
          type: object
          additionalProperties: true
        runtimeEnvironmentId:
          type: integer
          format: int64
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
      required: [ruleJson, runtimeEnvironmentId]

    NodePreviewRequest:
      type: object
      properties:
        ruleJson:
          type: object
          additionalProperties: true
        nodeId:
          type: string
        runtimeEnvironmentId:
          type: integer
          format: int64
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
      required: [ruleJson, nodeId, runtimeEnvironmentId]

    RuleRuntimeExecuteRequest:
      oneOf:
        - $ref: '#/components/schemas/RuleRuntimeExecuteFullRequest'
        - $ref: '#/components/schemas/RuleRuntimeExecuteNodeRequest'
        - $ref: '#/components/schemas/RuleRuntimeExecuteImpactRequest'
      discriminator:
        propertyName: mode
        mapping:
          FULL: '#/components/schemas/RuleRuntimeExecuteFullRequest'
          NODE: '#/components/schemas/RuleRuntimeExecuteNodeRequest'
          IMPACT: '#/components/schemas/RuleRuntimeExecuteImpactRequest'

    RuleRuntimeExecuteFullRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [FULL]
        runtimeEnvironmentId:
          type: integer
          format: int64
        rule:
          $ref: '#/components/schemas/UiRuleViewModel'
        options:
          $ref: '#/components/schemas/RuleRuntimeExecuteOptions'
      required: [mode, runtimeEnvironmentId, rule]

    RuleRuntimeExecuteNodeRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [NODE]
        runtimeEnvironmentId:
          type: integer
          format: int64
        rule:
          $ref: '#/components/schemas/UiRuleViewModel'
        nodeId:
          type: string
        options:
          $ref: '#/components/schemas/RuleRuntimeExecuteOptions'
      required: [mode, runtimeEnvironmentId, rule, nodeId]

    RuleRuntimeExecuteImpactRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [IMPACT]
        runtimeEnvironmentId:
          type: integer
          format: int64
        rule:
          $ref: '#/components/schemas/UiRuleViewModel'
        options:
          $ref: '#/components/schemas/RuleRuntimeExecuteImpactOptions'
      required: [mode, runtimeEnvironmentId, rule]

    RuleRuntimeExecuteOptions:
      type: object
      properties:
        page:
          type: integer
          format: int32
          minimum: 1
          default: 1
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
        withHighlight:
          type: boolean
          default: true
        withItems:
          type: boolean
          default: true

    RuleRuntimeExecuteImpactOptions:
      type: object
      properties:
        withHighlight:
          type: boolean
          enum: [false]
          default: false
        withItems:
          type: boolean
          enum: [false]
          default: false

    UiRuleViewModel:
      type: object
      properties:
        root:
          $ref: '#/components/schemas/UiExpressionNode'
        references:
          type: array
          items:
            $ref: '#/components/schemas/UiRuleReference'
      required: [root]

    UiExpressionNode:
      oneOf:
        - $ref: '#/components/schemas/UiLogicNode'
        - $ref: '#/components/schemas/UiProximityNode'
        - $ref: '#/components/schemas/UiFieldNode'
        - $ref: '#/components/schemas/UiTermSetNode'
        - $ref: '#/components/schemas/UiNotNode'
        - $ref: '#/components/schemas/UiScoreNode'
        - $ref: '#/components/schemas/UiTopicRefNode'
      discriminator:
        propertyName: type
        mapping:
          LOGIC: '#/components/schemas/UiLogicNode'
          PROXIMITY: '#/components/schemas/UiProximityNode'
          FIELD: '#/components/schemas/UiFieldNode'
          TERM_SET: '#/components/schemas/UiTermSetNode'
          NOT: '#/components/schemas/UiNotNode'
          SCORE: '#/components/schemas/UiScoreNode'
          TOPIC_REF: '#/components/schemas/UiTopicRefNode'

    UiLogicNode:
      type: object
      properties:
        type:
          type: string
          enum: [LOGIC]
        nodeId:
          type: string
        operator:
          type: string
          enum: [AND, OR, ACCRUE, LOGSUM, WEIGHTED]
        threshold:
          type: integer
          format: int32
        minMatch:
          type: integer
          format: int32
        children:
          type: array
          items:
            $ref: '#/components/schemas/UiExpressionNode'
      required: [type, children]

    UiProximityNode:
      type: object
      properties:
        type:
          type: string
          enum: [PROXIMITY]
        nodeId:
          type: string
        relation:
          type: string
        ordered:
          type: boolean
        distance:
          type: integer
          format: int32
        children:
          type: array
          items:
            $ref: '#/components/schemas/UiExpressionNode'
      required: [type, children]

    UiFieldNode:
      type: object
      properties:
        type:
          type: string
          enum: [FIELD]
        nodeId:
          type: string
        field:
          type: string
        child:
          $ref: '#/components/schemas/UiExpressionNode'
      required: [type, field, child]

    UiTermSetNode:
      type: object
      properties:
        type:
          type: string
          enum: [TERM_SET]
        nodeId:
          type: string
        terms:
          type: array
          items:
            $ref: '#/components/schemas/UiExpression'
        matchMode:
          type: string
          enum: [ANY, ALL]
      required: [type, terms]

    UiNotNode:
      type: object
      properties:
        type:
          type: string
          enum: [NOT]
        nodeId:
          type: string
        child:
          $ref: '#/components/schemas/UiExpressionNode'
      required: [type, child]

    UiScoreNode:
      type: object
      properties:
        type:
          type: string
          enum: [SCORE]
        nodeId:
          type: string
        operator:
          type: string
          enum: [AND, OR, ACCRUE, LOGSUM, WEIGHTED]
        threshold:
          type: integer
          format: int32
        minMatch:
          type: integer
          format: int32
        children:
          type: array
          items:
            $ref: '#/components/schemas/UiExpressionNode'
      required: [type, children]

    UiTopicRefNode:
      type: object
      properties:
        type:
          type: string
          enum: [TOPIC_REF]
        nodeId:
          type: string
        topicId:
          type: string
      required: [type, topicId]

    UiExpression:
      type: object
      properties:
        source:
          type: string
          enum: [CONCEPT, TERM]
        conceptId:
          type: string
          description: Required. For CONCEPT use concept id; for TERM use literal term text.
        conceptName:
          type: string
        includeDescendants:
          type: boolean
      required: [source, conceptId]

    UiRuleReference:
      type: object
      properties:
        type:
          type: string
        topicId:
          type: string
        mode:
          type: string
      required: [type, topicId]

    MatchedReasonView:
      type: object
      properties:
        field:
          type: string
        label:
          type: string
        displayText:
          type: string
        matchedTerms:
          type: array
          items:
            type: string
      required: [field, label, displayText, matchedTerms]

    RulePreviewItem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        matchedReasons:
          type: array
          items:
            $ref: '#/components/schemas/MatchedReasonView'
        highlightFragments:
          type: array
          items:
            type: string
      required: [id, title, matchedReasons, highlightFragments]

    ImpactConditionView:
      type: object
      properties:
        nodeId:
          type: string
        label:
          type: string
        removedTotal:
          type: integer
          format: int64
        contribution:
          type: integer
          format: int64
        impactLevel:
          type: string
          enum: [HIGH, MEDIUM, LOW, NONE]
      required: [nodeId, label, removedTotal, contribution, impactLevel]

    RulePreviewResponse:
      type: object
      properties:
        mode:
          type: string
          enum: [FULL, NODE]
        nodeId:
          type: string
          nullable: true
        total:
          type: integer
          format: int64
        previousTotal:
          type: integer
          format: int64
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/RulePreviewItem'
      required: [mode, total, items]

    RuleRuntimeExecuteResponse:
      oneOf:
        - $ref: '#/components/schemas/RuleRuntimeExecuteFullResponse'
        - $ref: '#/components/schemas/RuleRuntimeExecuteNodeResponse'
        - $ref: '#/components/schemas/RuleRuntimeExecuteImpactResponse'
      discriminator:
        propertyName: mode
        mapping:
          FULL: '#/components/schemas/RuleRuntimeExecuteFullResponse'
          NODE: '#/components/schemas/RuleRuntimeExecuteNodeResponse'
          IMPACT: '#/components/schemas/RuleRuntimeExecuteImpactResponse'

    RuleRuntimeExecuteFullResponse:
      type: object
      properties:
        mode:
          type: string
          enum: [FULL]
        runtimeEnvironmentId:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        took:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/RulePreviewItem'
        metadata:
          $ref: '#/components/schemas/RuntimeExecuteMetadata'
      required: [mode, runtimeEnvironmentId, total, page, size, took, items, metadata]

    RuleRuntimeExecuteNodeResponse:
      type: object
      properties:
        mode:
          type: string
          enum: [NODE]
        runtimeEnvironmentId:
          type: integer
          format: int64
        nodeId:
          type: string
        nodeTotal:
          type: integer
          format: int64
        fullTotal:
          type: integer
          format: int64
        delta:
          type: integer
          format: int64
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        took:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/RulePreviewItem'
        metadata:
          $ref: '#/components/schemas/RuntimeExecuteMetadata'
      required: [mode, runtimeEnvironmentId, nodeId, nodeTotal, fullTotal, delta, page, size, took, items, metadata]

    RuleRuntimeExecuteImpactResponse:
      type: object
      description: Statistical analysis mode. No document items are returned.
      properties:
        mode:
          type: string
          enum: [IMPACT]
        runtimeEnvironmentId:
          type: integer
          format: int64
        fullTotal:
          type: integer
          format: int64
        conditionCount:
          type: integer
          format: int32
        analysis:
          type: array
          items:
            $ref: '#/components/schemas/ImpactConditionView'
        took:
          type: integer
          format: int64
        metadata:
          $ref: '#/components/schemas/RuntimeExecuteMetadata'
      required: [mode, runtimeEnvironmentId, fullTotal, conditionCount, analysis, took, metadata]

    RuntimeExecuteMetadata:
      type: object
      properties:
        engineVersion:
          type: string
        executionId:
          type: string
      required: [engineVersion, executionId]

    PreviewDocumentDetailResponse:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string
        matchedReasons:
          type: array
          items:
            $ref: '#/components/schemas/MatchedReasonView'
        highlightFragments:
          type: array
          items:
            type: string
      required: [id, title, content, matchedReasons, highlightFragments]

    ErrorResponse:
      type: object
      properties:
        errorCode:
          type: string
        message:
          type: string
      required: [errorCode, message]

