components:
  schemas:
    RuntimeActiveItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        datasetName:
          type: string
        scopeLabel:
          type: string
      required: [id, name, datasetName, scopeLabel]

    RulePreviewRequest:
      type: object
      properties:
        ruleJson:
          type: object
          additionalProperties: true
        runtimeEnvironmentId:
          type: integer
          format: int64
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
      required: [ruleJson, runtimeEnvironmentId]

    NodePreviewRequest:
      type: object
      properties:
        ruleJson:
          type: object
          additionalProperties: true
        nodeId:
          type: string
        runtimeEnvironmentId:
          type: integer
          format: int64
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
      required: [ruleJson, nodeId, runtimeEnvironmentId]

    RuleRuntimeExecuteRequest:
      oneOf:
        - $ref: '#/components/schemas/RuleRuntimeExecuteFullRequest'
        - $ref: '#/components/schemas/RuleRuntimeExecuteNodeRequest'
        - $ref: '#/components/schemas/RuleRuntimeExecuteImpactRequest'
      discriminator:
        propertyName: mode
        mapping:
          FULL: '#/components/schemas/RuleRuntimeExecuteFullRequest'
          NODE: '#/components/schemas/RuleRuntimeExecuteNodeRequest'
          IMPACT: '#/components/schemas/RuleRuntimeExecuteImpactRequest'

    RuleRuntimeExecuteFullRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [FULL]
        runtimeEnvironmentId:
          type: integer
          format: int64
        rule:
          $ref: '#/components/schemas/UiRuleViewModel'
        options:
          $ref: '#/components/schemas/RuleRuntimeExecuteOptions'
      required: [mode, runtimeEnvironmentId, rule]

    RuleRuntimeExecuteNodeRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [NODE]
        runtimeEnvironmentId:
          type: integer
          format: int64
        rule:
          $ref: '#/components/schemas/UiRuleViewModel'
        nodeId:
          type: string
        options:
          $ref: '#/components/schemas/RuleRuntimeExecuteOptions'
      required: [mode, runtimeEnvironmentId, rule, nodeId]

    RuleRuntimeExecuteImpactRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [IMPACT]
        runtimeEnvironmentId:
          type: integer
          format: int64
        rule:
          $ref: '#/components/schemas/UiRuleViewModel'
        options:
          $ref: '#/components/schemas/RuleRuntimeExecuteImpactOptions'
      required: [mode, runtimeEnvironmentId, rule]

    RuleRuntimeExecuteOptions:
      type: object
      properties:
        page:
          type: integer
          format: int32
          minimum: 1
          default: 1
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
        withHighlight:
          type: boolean
          default: true
        withItems:
          type: boolean
          default: true

