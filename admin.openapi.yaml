  /api/runtime/deploy/metrics:
    get:
      tags: [Runtime]
      summary: Get runtime deploy observability metrics
      operationId: getRuntimeDeployMetrics
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRuntimeDeployMetricsResponse'

  /api/runtime/execution/metrics:
    get:
      tags: [Runtime]
      summary: Get runtime execution metrics for last 60 minutes
      operationId: getRuntimeExecutionMetrics
      parameters:
        - name: snapshotId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRuntimeExecutionMetricsResponse'

  /api/runtime/deployments/{snapshotId}/metrics:
    get:
      tags: [Runtime]
      summary: Get runtime execution metrics for one snapshot (last 60 minutes)
      operationId: getRuntimeExecutionMetricsBySnapshot
      parameters:
        - name: snapshotId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRuntimeExecutionMetricsResponse'

  /api/runtime/deployments:
    get:
      tags: [Runtime]
      summary: List deployments for a topic
      operationId: listRuntimeDeployments
      parameters:
        - name: topicId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRuntimeDeploymentListResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /api/runtime/deployments/{deploymentId}:
    get:
      tags: [Runtime]
      summary: Get deployment detail
      operationId: getRuntimeDeploymentDetail
      parameters:
        - name: deploymentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRuntimeDeploymentDetailResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /api/runtime/topic/{topicId}/status:
    get:
      tags: [Runtime]
      summary: Get aggregated runtime deployment status for a topic
      operationId: getRuntimeTopicStatus
      parameters:
        - name: topicId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRuntimeTopicStatusResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
    delete:
      tags: [Runtime]
      summary: Delete a pending deployment
      operationId: deleteRuntimePendingDeployment
      parameters:
        - name: deploymentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /api/rules/analyze:
    post:
      tags: [RuleGovernance]
      summary: Analyze rule complexity from UiRuleViewModel
      description: Supports weighted rule syntax via `BOOST` node and `TERM_SET.terms[].weight`.
      operationId: analyzeRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleAnalyzeRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRuleAnalyzeResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /api/rules/{id}/versions:
    get:
      tags: [RuleGovernance]
      summary: List persisted rule versions
      operationId: listRuleVersions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRuleVersionList'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /api/rules/{id}/version/{v}:
    get:
      tags: [RuleGovernance]
      summary: Get one persisted rule version
      description: `rule` response supports weighted nodes (`BOOST`) and term-level `weight`.
      operationId: getRuleVersion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: v
          in: path
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRuleVersionResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /api/rules/{id}/diff:
    get:
      tags: [RuleGovernance]
      summary: Diff two persisted rule versions
      operationId: diffRuleVersions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: to
          in: query
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRuleDiffResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /api/rules/preview:
    post:
      tags: [RulePreview]
      deprecated: true
      summary: Execute full rule preview
      description: Deprecated. Use POST /api/rules/runtime/execute with mode=FULL.
      operationId: previewRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RulePreviewRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulePreviewResponse'
              example:
                mode: FULL
                nodeId: null
                total: 311
                previousTotal: null
                items: []
        '400':
          description: Validation or mapping error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Runtime environment unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/rules/preview/node:
    post:
      tags: [RulePreview]
      deprecated: true
      summary: Execute node subtree preview
      description: Deprecated. Use POST /api/rules/runtime/execute with mode=NODE.
      operationId: previewRuleNode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodePreviewRequest'
            example:
              ruleJson:
                root:
                  type: FIELD
                  field: CONTENT
                  child:
                    type: LOGIC
                    operator: AND
                    children: []
              nodeId: 848a3813-a382-421c-b1f2-4f5f86f09a2a
              runtimeEnvironmentId: 1
              limit: 20
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulePreviewResponse'
              example:
                mode: NODE
                nodeId: 848a3813-a382-421c-b1f2-4f5f86f09a2a
                total: 860
                previousTotal: null
                items: []
        '400':
          description: Validation or mapping error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Runtime environment or node unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '408':
          description: Execution timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/rules/runtime/execute:
    post:
      tags: [RulePreview]
      summary: Execute runtime rule in FULL, NODE or IMPACT mode
      description: Preferred unified runtime execution endpoint for preview and analysis. IMPACT mode enforces count-only analysis, max 15 conditions, and a server-side timeout guard. Supports weighted rule syntax via `BOOST` node and `TERM_SET.terms[].weight`.
      x-max-condition-count: 15
      x-impact-timeout-ms: 2000
      operationId: executeRuntimeRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleRuntimeExecuteRequest'
            examples:
              fullMode:
                summary: FULL mode request
                value:
                  mode: FULL
                  runtimeEnvironmentId: 1
                  rule:
                    root:
                      type: LOGIC
                      nodeId: root-1
                      operator: AND
                      children:
                        - type: FIELD
                          nodeId: field-1
                          field: CONTENT
                          child:
                            type: TERM_SET
                            nodeId: term-1
                            matchMode: ANY
                            terms:
                              - source: CONCEPT
                                conceptId: "20"
                                conceptName: 人才
                                includeDescendants: false
                    references: []
                  options:
                    page: 1
                    size: 20
                    withHighlight: true
                    withItems: true
              nodeMode:
                summary: NODE mode request
                value:
                  mode: NODE
                  runtimeEnvironmentId: 1
                  nodeId: term-1
                  rule:
                    root:
                      type: LOGIC
                      nodeId: root-1
                      operator: AND
                      children:
                        - type: FIELD
                          nodeId: field-1
                          field: CONTENT
                          child:
                            type: TERM_SET
                            nodeId: term-1
                            matchMode: ANY
                            terms:
                              - source: CONCEPT
                                conceptId: "20"
                                conceptName: 人才
                                includeDescendants: false
                    references: []
                  options:
                    page: 1
                    size: 20
                    withHighlight: true
                    withItems: true
              impactMode:
                summary: IMPACT mode request
                value:
                  mode: IMPACT
                  runtimeEnvironmentId: 1
                  rule:
                    root:
                      type: LOGIC
                      nodeId: root-1
                      operator: AND
                      children:
                        - type: TERM_SET
                          nodeId: term-1
                          matchMode: ANY
                          terms:
                            - source: CONCEPT
                              conceptId: "20"
                              conceptName: 博士
                              includeDescendants: false
                        - type: TERM_SET
                          nodeId: term-2
                          matchMode: ANY
                          terms:
                            - source: CONCEPT
                              conceptId: "36"
                              conceptName: 人力社保部门
                              includeDescendants: false
                    references: []
                  options:
                    withItems: false
              fullModeWeighted:
                summary: FULL mode weighted request (BOOST + term weight)
                value:
                  mode: FULL
                  runtimeEnvironmentId: 1
                  rule:
                    root:
                      type: LOGIC
                      nodeId: root-weighted-1
                      operator: AND
                      children:
                        - type: FIELD
                          nodeId: field-title-1
                          field: TITLE
                          child:
                            type: BOOST
                            nodeId: boost-1
                            weight: 2.0
                            child:
                              type: TERM_SET
                              nodeId: termset-title-1
                              matchMode: ALL
                              terms:
                                - source: CONCEPT
                                  conceptId: "15"
                                  conceptName: 各地人力社保部门组织
                                  includeDescendants: false
                                  weight: 1.2
                                - source: CONCEPT
                                  conceptId: "36"
                                  conceptName: 区级人力社保部门
                                  includeDescendants: false
                                  weight: 1.8
                        - type: TERM_SET
                          nodeId: termset-content-1
                          matchMode: ANY
                          terms:
                            - source: CONCEPT
                              conceptId: "17"
                              conceptName: 区人才服务中心戚老师
                              includeDescendants: false
                              weight: 1.5
                    references: []
                  options:
                    page: 1
                    size: 20
                    withHighlight: true
                    withItems: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleRuntimeExecuteResponse'
              examples:
                fullMode:
                  summary: FULL mode response
                  value:
                    mode: FULL
                    runtimeEnvironmentId: 1
                    total: 311
                    page: 1
                    size: 20
                    took: 43
                    items:
                      - id: doc-1
                        title: 关于人才补贴政策
                        matchedReasons:
                          - field: DOC_TEXT
                            label: 正文
                            displayText: 正文包含“人才”
                            matchedTerms: [人才]
                        highlightFragments:
                          - "...符合<mark>人才</mark>补贴条件..."
                    metadata:
                      engineVersion: "1.0"
                      executionId: "d4be8a53-c283-4fd2-8a75-d5f88f6ab020"
                nodeMode:
                  summary: NODE mode response
                  value:
                    mode: NODE
                    runtimeEnvironmentId: 1
                    nodeId: term-1
                    page: 1
                    size: 20
                    fullTotal: 311
                    nodeTotal: 860
                    delta: 549
                    took: 65
                    items:
                      - id: doc-2
                        title: 2023年度领军人才项目
                        matchedReasons:
                          - field: DOC_TEXT
                            label: 正文
                            displayText: 正文包含“博士”
                            matchedTerms: [博士]
                        highlightFragments:
                          - "...出站<mark>博士</mark>后可申报..."
                    metadata:
                      engineVersion: "1.0"
                      executionId: "2fe20bf6-184f-4f3a-a05d-f7c83d39ce8b"
                impactMode:
                  summary: IMPACT mode response
                  value:
                    mode: IMPACT
                    runtimeEnvironmentId: 1
                    fullTotal: 311
                    conditionCount: 2
                    took: 210
                    analysis:
                      - nodeId: term-1
                        label: 博士
                        removedTotal: 720
                        contribution: 409
                        impactLevel: HIGH
                      - nodeId: term-2
                        label: 人力社保部门
                        removedTotal: 323
                        contribution: 12
                        impactLevel: LOW
                    metadata:
                      engineVersion: "1.0"
                      executionId: "9369a176-387e-43d8-bf28-f75f01386158"
        '400':
          description: Validation or mapping error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Runtime environment or node unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/rules/runtime/execute/analysis:
