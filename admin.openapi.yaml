    UiRuleViewModel:
      type: object
      properties:
        root:
          $ref: '#/components/schemas/UiExpressionNode'
        references:
          type: array
          items:
            $ref: '#/components/schemas/UiRuleReference'
      required: [root]

    UiExpressionNode:
      oneOf:
        - $ref: '#/components/schemas/UiLogicNode'
        - $ref: '#/components/schemas/UiProximityNode'
        - $ref: '#/components/schemas/UiPositionRelationNode'
        - $ref: '#/components/schemas/UiStructureNode'
        - $ref: '#/components/schemas/UiFieldNode'
        - $ref: '#/components/schemas/UiTermSetNode'
        - $ref: '#/components/schemas/UiNotNode'
        - $ref: '#/components/schemas/UiScoreNode'
        - $ref: '#/components/schemas/UiTopicRefNode'
      discriminator:
        propertyName: type
        mapping:
          LOGIC: '#/components/schemas/UiLogicNode'
          PROXIMITY: '#/components/schemas/UiProximityNode'
          POSITION_RELATION: '#/components/schemas/UiPositionRelationNode'
          STRUCTURE: '#/components/schemas/UiStructureNode'
          FIELD: '#/components/schemas/UiFieldNode'
          TERM_SET: '#/components/schemas/UiTermSetNode'
          NOT: '#/components/schemas/UiNotNode'
          SCORE: '#/components/schemas/UiScoreNode'
          TOPIC_REF: '#/components/schemas/UiTopicRefNode'

    UiLogicNode:
      type: object
      properties:
        type:
          type: string
          enum: [LOGIC]
        nodeId:
          type: string
        operator:
          type: string
        threshold:
          type: integer
          format: int32
        children:
          type: array
          items:
            $ref: '#/components/schemas/UiExpressionNode'
      required: [type, children]

    UiProximityNode:
      type: object
      properties:
        type:
          type: string
          enum: [PROXIMITY]
        nodeId:
          type: string
        relation:
          type: string
        ordered:
          type: boolean
        distance:
          type: integer
          format: int32
        children:
          type: array
          items:
            $ref: '#/components/schemas/UiExpressionNode'
      required: [type, children]

    UiPositionRelationNode:
      type: object
      properties:
        type:
          type: string
          enum: [POSITION_RELATION]
        nodeId:
          type: string
        mode:
          type: string
          enum: [PROXIMITY]
        relation:
          type: string
        ordered:
          type: boolean
        distance:
          type: integer
          format: int32
        children:
          type: array
          items:
            $ref: '#/components/schemas/UiExpressionNode'
      required: [type, mode, children]

    UiStructureNode:
      type: object
      properties:
        type:
          type: string
          enum: [STRUCTURE]
        nodeId:
          type: string
        scope:
          type: string
          enum: [NONE, SENTENCE, PARAGRAPH]
        child:
          $ref: '#/components/schemas/UiExpressionNode'
      required: [type, scope, child]

    UiFieldNode:
      type: object
      properties:
        type:
          type: string
          enum: [FIELD]
        nodeId:
          type: string
        field:
          type: string
        child:
          $ref: '#/components/schemas/UiExpressionNode'
      required: [type, field, child]

    UiTermSetNode:
      type: object
      properties:
        type:
          type: string
          enum: [TERM_SET]
        nodeId:
          type: string
        terms:
          type: array
          items:
            $ref: '#/components/schemas/UiExpression'
        matchMode:
          type: string
          enum: [ANY, ALL]
      required: [type, terms]

    UiNotNode:
      type: object
      properties:
        type:
          type: string
          enum: [NOT]
        nodeId:
          type: string
        child:
          $ref: '#/components/schemas/UiExpressionNode'
      required: [type, child]

    UiScoreNode:
      type: object
      properties:
        type:
          type: string
          enum: [SCORE]
        nodeId:
          type: string
        operator:
          type: string
        threshold:
          type: integer
          format: int32
        children:
          type: array
          items:
            $ref: '#/components/schemas/UiExpressionNode'
      required: [type, children]

    UiTopicRefNode:
      type: object
      properties:
        type:
          type: string
          enum: [TOPIC_REF]
        nodeId:
          type: string
        topicId:
          type: string
      required: [type, topicId]

    UiExpression:
      type: object
      properties:
        source:
          type: string
          enum: [CONCEPT, TERM]
        conceptId:
          type: string
          description: Required. For CONCEPT use concept id; for TERM use literal term text.
        conceptName:
          type: string
        includeDescendants:
          type: boolean
      required: [source, conceptId]

    UiRuleReference:
      type: object
      properties:
        type:
          type: string
        topicId:
          type: string
        mode:
          type: string
      required: [type, topicId]

    MatchedReasonView:
      type: object
      properties:
        field:
          type: string
        label:
          type: string
        displayText:
          type: string
        matchedTerms:
          type: array
          items:
            type: string
      required: [field, label, displayText, matchedTerms]

    RulePreviewItem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        matchedReasons:
          type: array
          items:
            $ref: '#/components/schemas/MatchedReasonView'
        highlightFragments:
          type: array
          items:
            type: string
      required: [id, title, matchedReasons, highlightFragments]

    ImpactConditionView:
      type: object
      properties:
        nodeId:
          type: string
        label:
          type: string
        removedTotal:
          type: integer
          format: int64
        contribution:
          type: integer
          format: int64
        impactLevel:
          type: string
          enum: [HIGH, MEDIUM, LOW, NONE]
      required: [nodeId, label, removedTotal, contribution, impactLevel]

    RulePreviewResponse:
      type: object
      properties:
        mode:
          type: string
          enum: [FULL, NODE]
        nodeId:
          type: string
          nullable: true
        total:
          type: integer
          format: int64
        previousTotal:
          type: integer
          format: int64
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/RulePreviewItem'
      required: [mode, total, items]

    RuleRuntimeExecuteResponse:
      oneOf:
        - $ref: '#/components/schemas/RuleRuntimeExecuteFullResponse'
        - $ref: '#/components/schemas/RuleRuntimeExecuteNodeResponse'
        - $ref: '#/components/schemas/RuleRuntimeExecuteImpactResponse'
      discriminator:
        propertyName: mode
        mapping:
          FULL: '#/components/schemas/RuleRuntimeExecuteFullResponse'
          NODE: '#/components/schemas/RuleRuntimeExecuteNodeResponse'
          IMPACT: '#/components/schemas/RuleRuntimeExecuteImpactResponse'

    RuleRuntimeExecuteFullResponse:
      type: object
      properties:
        mode:
          type: string
          enum: [FULL]
        runtimeEnvironmentId:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
        clauseCount:
          type: integer
          format: int32
        maxDepth:
          type: integer
          format: int32
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        took:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/RulePreviewItem'
        metadata:
          $ref: '#/components/schemas/RuntimeExecuteMetadata'
      required: [mode, runtimeEnvironmentId, total, clauseCount, maxDepth, page, size, took, items, metadata]

    RuleRuntimeExecuteNodeResponse:
      type: object
      properties:
        mode:
          type: string
          enum: [NODE]
        runtimeEnvironmentId:
          type: integer
          format: int64
        nodeId:
          type: string
        nodeTotal:
          type: integer
          format: int64
        fullTotal:
          type: integer
          format: int64
        delta:
          type: integer
          format: int64
        clauseCount:
          type: integer
          format: int32
        maxDepth:
          type: integer
          format: int32
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        took:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/RulePreviewItem'
        metadata:
          $ref: '#/components/schemas/RuntimeExecuteMetadata'
      required: [mode, runtimeEnvironmentId, nodeId, nodeTotal, fullTotal, delta, clauseCount, maxDepth, page, size, took, items, metadata]

    RuleRuntimeExecuteImpactResponse:
      type: object
      description: Statistical analysis mode. No document items are returned.
      properties:
        mode:
          type: string
          enum: [IMPACT]
        runtimeEnvironmentId:
          type: integer
          format: int64
        fullTotal:
          type: integer
          format: int64
        conditionCount:
          type: integer
          format: int32
        analysis:
          type: array
          items:
            $ref: '#/components/schemas/ImpactConditionView'
        took:
          type: integer
          format: int64
        metadata:
          $ref: '#/components/schemas/RuntimeExecuteMetadata'
      required: [mode, runtimeEnvironmentId, fullTotal, conditionCount, analysis, took, metadata]

    RuntimeExecuteMetadata:
      type: object
      properties:
        engineVersion:
          type: string
        executionId:
          type: string
      required: [engineVersion, executionId]

    RuntimeDeployValidateRequest:
      type: object
      properties:
        topicId:
          type: string
        environmentId:
          type: integer
          format: int64
      required: [topicId, environmentId]

    RuntimeDeployValidateResponse:
      type: object
      properties:
        valid:
          type: boolean
        missingFields:
          type: array
          items:
            type: string
        currentActiveSnapshotId:
          type: integer
          format: int64
          nullable: true
        message:
          type: string
          nullable: true
      required: [valid, missingFields]

    RuntimeDeployRequest:
      type: object
      properties:
        topicId:
          type: string
        environmentId:
          type: integer
          format: int64
        activate:
          type: boolean
          nullable: true
        verifyExecution:
          type: boolean
          nullable: true
        operator:
          type: string
          nullable: true
      required: [topicId, environmentId]

    RuntimeDeployResponse:
      type: object
      properties:
        snapshotId:
          type: integer
          format: int64
        deploymentId:
          type: integer
          format: int64
        status:
          type: string
      required: [snapshotId, deploymentId, status]

    RuntimeTransitionRequest:
      type: object
      properties:
        operator:
          type: string
          nullable: true
        verifyExecution:
          type: boolean
          nullable: true

    RuntimeDeployMetricsView:
      type: object
      properties:
        counters:
          type: object
          additionalProperties:
            type: integer
            format: int64
        avgDurationMs:
          type: object
          additionalProperties:
            type: number
            format: double
      required: [counters, avgDurationMs]

    RuntimeExecutionMetricsView:
      type: object
      properties:
        snapshotId:
          type: integer
          format: int64
          nullable: true
        windowMinutes:
          type: integer
          format: int32
        executionCount:
          type: integer
          format: int64
        avgLatencyMs:
          type: number
          format: double
        cacheHitRate:
          type: number
          format: double
        failedCount:
          type: integer
          format: int64
      required: [windowMinutes, executionCount, avgLatencyMs, cacheHitRate, failedCount]

    RuntimeTopicEnvironmentStatusView:
      type: object
      properties:
        environmentId:
          type: integer
          format: int64
          nullable: true
        name:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        revision:
          type: integer
          format: int32
          nullable: true
      required: [environmentId, name, status, revision]

    RuntimeTopicStatusView:
      type: object
      properties:
        environments:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeTopicEnvironmentStatusView'
        activeCount:
          type: integer
          format: int32
      required: [environments, activeCount]

    RuntimeDeploymentListItemView:
      type: object
      properties:
        deploymentId:
          type: integer
          format: int64
        topicId:
          type: string
        snapshotId:
          type: integer
          format: int64
        snapshotVersion:
          type: integer
          format: int32
          nullable: true
        publishedRevision:
          type: integer
          format: int32
          nullable: true
        environmentId:
          type: integer
          format: int64
          nullable: true
        environmentName:
          type: string
          nullable: true
        status:
          type: string
        rawStatus:
          type: string
          nullable: true
        deployedAt:
          type: string
          format: date-time
          nullable: true
        deployedBy:
          type: string
          nullable: true
        canActivate:
          type: boolean
        canRollback:
          type: boolean
        canDelete:
          type: boolean
        canViewLog:
          type: boolean
      required: [deploymentId, topicId, snapshotId, status, canActivate, canRollback, canDelete, canViewLog]

    RuntimeDeploymentDetailView:
      type: object
      properties:
        deploymentId:
          type: integer
          format: int64
        topicId:
          type: string
        snapshotId:
          type: integer
          format: int64
        snapshotVersion:
          type: integer
          format: int32
          nullable: true
        publishedRevision:
          type: integer
          format: int32
          nullable: true
        environmentId:
          type: integer
          format: int64
          nullable: true
        environmentName:
          type: string
          nullable: true
        status:
          type: string
        rawStatus:
          type: string
          nullable: true
        deployedAt:
          type: string
          format: date-time
          nullable: true
        deployedBy:
          type: string
          nullable: true
        deploymentLog:
          type: string
          nullable: true
      required: [deploymentId, topicId, snapshotId, status]

    PreviewDocumentDetailResponse:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string
        matchedReasons:
          type: array
          items:
            $ref: '#/components/schemas/MatchedReasonView'
        highlightFragments:
          type: array
          items:
            type: string
      required: [id, title, content, matchedReasons, highlightFragments]

    ErrorResponse:
      type: object
      properties:
        errorCode:
          type: string
        message:
          type: string
      required: [errorCode, message]

