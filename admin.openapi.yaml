openapi: 3.0.3
info:
  title: RuleOps Rule Preview API
  version: 2.1.0
  description: APIs for in-memory rule editing, full preview, and node-level preview.
servers:
  - url: http://localhost:8080

tags:
  - name: Runtime
    description: Runtime environment selection for preview
  - name: RulePreview
    description: Rule preview and preview document detail
  - name: RuleGovernance
    description: Rule analysis and version governance APIs

paths:
  /api/runtime/active:
    get:
      tags: [Runtime]
      summary: List active runtime environments
      operationId: listActiveRuntimeEnvironments
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RuntimeActiveItem'

  /api/runtime/deploy/validate:
    post:
      tags: [Runtime]
      summary: Validate topic deployability on runtime environment
      operationId: validateRuntimeDeploy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeDeployValidateRequest'
            example:
              topicId: TALENT_POLICY
              environmentId: 3
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRuntimeDeployValidateResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /api/runtime/deploy:
    post:
      tags: [Runtime]
      summary: Create runtime snapshot and deployment record
      operationId: createRuntimeDeploy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeDeployRequest'
            example:
              topicId: TALENT_POLICY
              environmentId: 3
              activate: true
              operator: admin
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRuntimeDeployResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /api/runtime/deploy/{deploymentId}/activate:
    post:
      tags: [Runtime]
      summary: Activate an existing runtime deployment
      operationId: activateRuntimeDeployment
      parameters:
        - name: deploymentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeTransitionRequest'
            example:
              operator: admin
              verifyExecution: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRuntimeDeployResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /api/runtime/deploy/metrics:
    get:
      tags: [Runtime]
      summary: Get runtime deploy observability metrics
      operationId: getRuntimeDeployMetrics
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRuntimeDeployMetricsResponse'

  /api/runtime/execution/metrics:
    get:
      tags: [Runtime]
      summary: Get runtime execution metrics for last 60 minutes
      operationId: getRuntimeExecutionMetrics
      parameters:
        - name: snapshotId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRuntimeExecutionMetricsResponse'

  /api/runtime/deployments/{snapshotId}/metrics:
    get:
      tags: [Runtime]
      summary: Get runtime execution metrics for one snapshot (last 60 minutes)
      operationId: getRuntimeExecutionMetricsBySnapshot
      parameters:
        - name: snapshotId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRuntimeExecutionMetricsResponse'

  /api/runtime/deployments:
    get:
      tags: [Runtime]
      summary: List deployments for a topic
      operationId: listRuntimeDeployments
      parameters:
        - name: topicId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRuntimeDeploymentListResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /api/runtime/deployments/{deploymentId}:
    get:
      tags: [Runtime]
      summary: Get deployment detail
      operationId: getRuntimeDeploymentDetail
      parameters:
        - name: deploymentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRuntimeDeploymentDetailResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /api/runtime/topic/{topicId}/status:
    get:
      tags: [Runtime]
      summary: Get aggregated runtime deployment status for a topic
      operationId: getRuntimeTopicStatus
      parameters:
        - name: topicId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRuntimeTopicStatusResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
    delete:
      tags: [Runtime]
      summary: Delete a pending deployment
      operationId: deleteRuntimePendingDeployment
      parameters:
        - name: deploymentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /api/rules/analyze:
    post:
      tags: [RuleGovernance]
      summary: Analyze rule complexity from UiRuleViewModel
      operationId: analyzeRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleAnalyzeRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRuleAnalyzeResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /api/rules/{id}/versions:
    get:
      tags: [RuleGovernance]
      summary: List persisted rule versions
      operationId: listRuleVersions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRuleVersionList'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /api/rules/{id}/version/{v}:
    get:
      tags: [RuleGovernance]
      summary: Get one persisted rule version
      operationId: getRuleVersion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: v
          in: path
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRuleVersionResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /api/rules/{id}/diff:
    get:
      tags: [RuleGovernance]
      summary: Diff two persisted rule versions
      operationId: diffRuleVersions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: to
          in: query
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRuleDiffResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /api/rules/preview:
    post:
      tags: [RulePreview]
      deprecated: true
      summary: Execute full rule preview
      description: Deprecated. Use POST /api/rules/runtime/execute with mode=FULL.
      operationId: previewRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RulePreviewRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulePreviewResponse'
              example:
                mode: FULL
                nodeId: null
                total: 311
                previousTotal: null
                items: []
        '400':
          description: Validation or mapping error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Runtime environment unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/rules/preview/node:
    post:
      tags: [RulePreview]
      deprecated: true
      summary: Execute node subtree preview
      description: Deprecated. Use POST /api/rules/runtime/execute with mode=NODE.
      operationId: previewRuleNode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodePreviewRequest'
            example:
              ruleJson:
                root:
                  type: FIELD
                  field: CONTENT
                  child:
                    type: LOGIC
                    operator: AND
                    children: []
              nodeId: 848a3813-a382-421c-b1f2-4f5f86f09a2a
              runtimeEnvironmentId: 1
              limit: 20
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulePreviewResponse'
              example:
                mode: NODE
                nodeId: 848a3813-a382-421c-b1f2-4f5f86f09a2a
                total: 860
                previousTotal: null
                items: []
        '400':
          description: Validation or mapping error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Runtime environment or node unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '408':
          description: Execution timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/rules/runtime/execute:
    post:
      tags: [RulePreview]
      summary: Execute runtime rule in FULL, NODE or IMPACT mode
      description: Preferred unified runtime execution endpoint for preview and analysis. IMPACT mode enforces count-only analysis, max 15 conditions, and a server-side timeout guard.
      x-max-condition-count: 15
      x-impact-timeout-ms: 2000
      operationId: executeRuntimeRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleRuntimeExecuteRequest'
            examples:
              fullMode:
                summary: FULL mode request
                value:
                  mode: FULL
                  runtimeEnvironmentId: 1
                  rule:
                    root:
                      type: LOGIC
                      nodeId: root-1
                      operator: AND
                      children:
                        - type: FIELD
                          nodeId: field-1
                          field: CONTENT
                          child:
                            type: TERM_SET
                            nodeId: term-1
                            matchMode: ANY
                            terms:
                              - source: CONCEPT
                                conceptId: "20"
                                conceptName: 人才
                                includeDescendants: false
                    references: []
                  options:
                    page: 1
                    size: 20
                    withHighlight: true
                    withItems: true
              nodeMode:
                summary: NODE mode request
                value:
                  mode: NODE
                  runtimeEnvironmentId: 1
                  nodeId: term-1
                  rule:
                    root:
                      type: LOGIC
                      nodeId: root-1
                      operator: AND
                      children:
                        - type: FIELD
                          nodeId: field-1
                          field: CONTENT
                          child:
                            type: TERM_SET
                            nodeId: term-1
                            matchMode: ANY
                            terms:
                              - source: CONCEPT
                                conceptId: "20"
                                conceptName: 人才
                                includeDescendants: false
                    references: []
                  options:
                    page: 1
                    size: 20
                    withHighlight: true
                    withItems: true
              impactMode:
                summary: IMPACT mode request
                value:
                  mode: IMPACT
                  runtimeEnvironmentId: 1
                  rule:
                    root:
                      type: LOGIC
                      nodeId: root-1
                      operator: AND
                      children:
                        - type: TERM_SET
                          nodeId: term-1
                          matchMode: ANY
                          terms:
                            - source: CONCEPT
                              conceptId: "20"
                              conceptName: 博士
                              includeDescendants: false
                        - type: TERM_SET
                          nodeId: term-2
                          matchMode: ANY
                          terms:
                            - source: CONCEPT
                              conceptId: "36"
                              conceptName: 人力社保部门
                              includeDescendants: false
                    references: []
                  options:
                    withItems: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleRuntimeExecuteResponse'
              examples:
                fullMode:
                  summary: FULL mode response
                  value:
                    mode: FULL
                    runtimeEnvironmentId: 1
                    total: 311
                    page: 1
                    size: 20
                    took: 43
                    items:
                      - id: doc-1
                        title: 关于人才补贴政策
                        matchedReasons:
                          - field: DOC_TEXT
                            label: 正文
                            displayText: 正文包含“人才”
                            matchedTerms: [人才]
                        highlightFragments:
                          - "...符合<mark>人才</mark>补贴条件..."
                    metadata:
                      engineVersion: "1.0"
                      executionId: "d4be8a53-c283-4fd2-8a75-d5f88f6ab020"
                nodeMode:
                  summary: NODE mode response
                  value:
                    mode: NODE
                    runtimeEnvironmentId: 1
                    nodeId: term-1
                    page: 1
                    size: 20
                    fullTotal: 311
                    nodeTotal: 860
                    delta: 549
                    took: 65
                    items:
                      - id: doc-2
                        title: 2023年度领军人才项目
                        matchedReasons:
                          - field: DOC_TEXT
                            label: 正文
                            displayText: 正文包含“博士”
                            matchedTerms: [博士]
                        highlightFragments:
                          - "...出站<mark>博士</mark>后可申报..."
                    metadata:
                      engineVersion: "1.0"
                      executionId: "2fe20bf6-184f-4f3a-a05d-f7c83d39ce8b"
                impactMode:
                  summary: IMPACT mode response
                  value:
                    mode: IMPACT
                    runtimeEnvironmentId: 1
                    fullTotal: 311
                    conditionCount: 2
                    took: 210
                    analysis:
                      - nodeId: term-1
                        label: 博士
                        removedTotal: 720
                        contribution: 409
                        impactLevel: HIGH
                      - nodeId: term-2
                        label: 人力社保部门
                        removedTotal: 323
                        contribution: 12
                        impactLevel: LOW
                    metadata:
                      engineVersion: "1.0"
                      executionId: "9369a176-387e-43d8-bf28-f75f01386158"
        '400':
          description: Validation or mapping error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Runtime environment or node unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/rules/runtime/execute/analysis:
    post:
      tags: [RulePreview]
      summary: Execute runtime rule analysis with aggregated statistics
      description: Aggregated full-scope statistics for term hits, node hits, contribution distribution, and dataset-level hit rate.
      operationId: executeRuntimeRuleAnalysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleRuntimeExecuteAnalysisRequest'
            example:
              runtimeEnvironmentId: 1
              rule:
                root:
                  type: LOGIC
                  nodeId: root-1
                  operator: AND
                  children:
                    - type: FIELD
                      nodeId: field-1
                      field: CONTENT
                      child:
                        type: TERM_SET
                        nodeId: term-1
                        matchMode: ANY
                        terms:
                          - source: TERM
                            conceptId: "alpha"
                            conceptName: alpha
                            includeDescendants: false
                    - type: TERM_SET
                      nodeId: term-2
                      matchMode: ANY
                      terms:
                        - source: CONCEPT
                          conceptId: "20"
                          conceptName: 人才
                          includeDescendants: false
                references: []
              options:
                bucketSizePercent: 10
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleRuntimeExecuteAnalysisResponse'
        '400':
          description: Validation or mapping error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Runtime environment unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '408':
          description: Execution timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/rules/runtime/compare:
    post:
      tags: [RulePreview]
      summary: Compare two rules under same runtime environment
      operationId: compareRuntimeRules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleRuntimeCompareRequest'
            example:
              runtimeEnvironmentId: 1
              ruleA:
                root:
                  type: TERM_SET
                  nodeId: a1
                  matchMode: ANY
                  terms:
                    - source: TERM
                      conceptId: alpha
                      conceptName: alpha
                      includeDescendants: false
                references: []
              ruleB:
                root:
                  type: TERM_SET
                  nodeId: b1
                  matchMode: ANY
                  terms:
                    - source: TERM
                      conceptId: beta
                      conceptName: beta
                      includeDescendants: false
                references: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleRuntimeCompareResponse'
        '400':
          description: Validation or mapping error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Runtime environment unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '408':
          description: Execution timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/rules/runtime/suggest:
    post:
      tags: [RulePreview]
      summary: Generate optimization suggestions for rule
      operationId: suggestRuntimeRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleRuntimeSuggestRequest'
            example:
              runtimeEnvironmentId: 1
              rule:
                root:
                  type: TERM_SET
                  nodeId: n1
                  matchMode: ANY
                  terms:
                    - source: TERM
                      conceptId: alpha
                      conceptName: alpha
                      includeDescendants: false
                references: []
              options:
                lowContributionThreshold: 0.05
                maxSuggestions: 20
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleRuntimeSuggestResponse'
        '400':
          description: Validation or mapping error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Runtime environment unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '408':
          description: Execution timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/rules/runtime/risk:
    post:
      tags: [RulePreview]
      summary: Evaluate runtime risk of a rule
      operationId: evaluateRuntimeRuleRisk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleRuntimeRiskRequest'
            example:
              runtimeEnvironmentId: 1
              rule:
                root:
                  type: TERM_SET
                  nodeId: n1
                  matchMode: ANY
                  terms:
                    - source: TERM
                      conceptId: alpha
                      conceptName: alpha
                      includeDescendants: false
                references: []
              options:
                slowExecutionMs: 2000
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleRuntimeRiskResponse'
        '400':
          description: Validation or mapping error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Runtime environment unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '408':
          description: Execution timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/rules/preview/document/{docId}:
    get:
      tags: [RulePreview]
      deprecated: true
      summary: Get preview document detail
      description: Deprecated legacy endpoint kept for compatibility.
      operationId: getPreviewDocumentDetail
      parameters:
        - name: docId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewDocumentDetailResponse'
        '404':
          description: Document not found in preview scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/topics/{topicId}/reviews/{revision}:
    get:
      tags: [RuleGovernance]
      summary: Get topic review snapshot by revision
      operationId: getTopicReviewByRevision
      parameters:
        - name: topicId
          in: path
          required: true
          schema:
            type: string
        - name: revision
          in: path
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTopicReviewResponse'
              example:
                success: true
                data:
                  id: topic-2c25c144-7f84-4349-bdcc-dff20519d0da
                  contentHash: 9bc5f8a0c2f9dcb4c6d6f4bc9eead6b9a66cc7b3003cd8f71a8a7f6af9ecaa12
                  template_id: 16
                  template_version: 1
                  rule:
                    root:
                      type: LOGIC
                      nodeId: null
                      operator: AND
                      threshold: null
                      children:
                        - type: TERM_SET
                          nodeId: null
                          terms:
                            - source: CONCEPT
                              conceptId: '108'
                              conceptName: 出站博士后
                              includeDescendants: false
                          matchMode: ANY
                          childrenList: []
                        - type: TERM_SET
                          nodeId: null
                          terms:
                            - source: CONCEPT
                              conceptId: '20'
                              conceptName: 中青年专业技术人才
                              includeDescendants: false
                            - source: CONCEPT
                              conceptId: '116'
                              conceptName: 对象人选
                              includeDescendants: false
                          matchMode: ANY
                          childrenList: []
                      childrenList:
                        - type: TERM_SET
                          nodeId: null
                          terms:
                            - source: CONCEPT
                              conceptId: '108'
                              conceptName: 出站博士后
                              includeDescendants: false
                          matchMode: ANY
                          childrenList: []
                        - type: TERM_SET
                          nodeId: null
                          terms:
                            - source: CONCEPT
                              conceptId: '20'
                              conceptName: 中青年专业技术人才
                              includeDescendants: false
                            - source: CONCEPT
                              conceptId: '116'
