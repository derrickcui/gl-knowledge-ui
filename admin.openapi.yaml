        options:
          $ref: '#/components/schemas/RuleRuntimeExecuteAnalysisOptions'
      required: [runtimeEnvironmentId, rule]

    RuleRuntimeExecuteAnalysisOptions:
      type: object
      properties:
        bucketSizePercent:
          type: integer
          format: int32
          minimum: 1
          maximum: 50
          default: 10

