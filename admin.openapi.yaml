openapi: 3.0.3
info:
  title: RuleOps Rule Preview API
  version: 2.1.0
  description: APIs for in-memory rule editing, full preview, and node-level preview.
servers:
  - url: http://localhost:8080

tags:
  - name: Runtime
    description: Runtime environment selection for preview
  - name: RulePreview
    description: Rule preview and preview document detail
  - name: RuleGovernance
    description: Rule analysis and version governance APIs

paths:
  /api/runtime/active:
    get:
      tags: [Runtime]
      summary: List active runtime environments
      operationId: listActiveRuntimeEnvironments
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RuntimeActiveItem'

  /api/rules/analyze:
    post:
      tags: [RuleGovernance]
      summary: Analyze rule complexity from UiRuleViewModel
      operationId: analyzeRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleAnalyzeRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRuleAnalyzeResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /api/rules/{id}/versions:
    get:
      tags: [RuleGovernance]
      summary: List persisted rule versions
      operationId: listRuleVersions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRuleVersionList'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /api/rules/{id}/version/{v}:
    get:
      tags: [RuleGovernance]
      summary: Get one persisted rule version
      operationId: getRuleVersion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: v
          in: path
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRuleVersionResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /api/rules/{id}/diff:
    get:
      tags: [RuleGovernance]
      summary: Diff two persisted rule versions
      operationId: diffRuleVersions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: to
          in: query
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRuleDiffResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /api/rules/preview:
    post:
      tags: [RulePreview]
      deprecated: true
      summary: Execute full rule preview
      description: Deprecated. Use POST /api/rules/runtime/execute with mode=FULL.
      operationId: previewRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RulePreviewRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulePreviewResponse'
              example:
                mode: FULL
                nodeId: null
                total: 311
                previousTotal: null
                items: []
        '400':
          description: Validation or mapping error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Runtime environment unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/rules/preview/node:
    post:
      tags: [RulePreview]
      deprecated: true
      summary: Execute node subtree preview
      description: Deprecated. Use POST /api/rules/runtime/execute with mode=NODE.
      operationId: previewRuleNode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodePreviewRequest'
            example:
              ruleJson:
                root:
                  type: FIELD
                  field: CONTENT
                  child:
                    type: LOGIC
                    operator: AND
                    children: []
              nodeId: 848a3813-a382-421c-b1f2-4f5f86f09a2a
              runtimeEnvironmentId: 1
              limit: 20
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulePreviewResponse'
              example:
                mode: NODE
                nodeId: 848a3813-a382-421c-b1f2-4f5f86f09a2a
                total: 860
                previousTotal: null
                items: []
        '400':
          description: Validation or mapping error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Runtime environment or node unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '408':
          description: Execution timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/rules/runtime/execute:
    post:
      tags: [RulePreview]
      summary: Execute runtime rule in FULL, NODE or IMPACT mode
      description: Preferred unified runtime execution endpoint for preview and analysis. IMPACT mode enforces count-only analysis, max 15 conditions, and a server-side timeout guard.
      x-max-condition-count: 15
      x-impact-timeout-ms: 2000
      operationId: executeRuntimeRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleRuntimeExecuteRequest'
            examples:
              fullMode:
                summary: FULL mode request
                value:
                  mode: FULL
                  runtimeEnvironmentId: 1
                  rule:
                    root:
                      type: LOGIC
                      nodeId: root-1
                      operator: AND
                      children:
                        - type: FIELD
                          nodeId: field-1
                          field: CONTENT
                          child:
                            type: TERM_SET
                            nodeId: term-1
                            matchMode: ANY
                            terms:
                              - source: CONCEPT
                                conceptId: "20"
                                conceptName: 人才
                                includeDescendants: false
                    references: []
                  options:
                    page: 1
                    size: 20
                    withHighlight: true
                    withItems: true
              nodeMode:
                summary: NODE mode request
                value:
                  mode: NODE
                  runtimeEnvironmentId: 1
                  nodeId: term-1
                  rule:
                    root:
                      type: LOGIC
                      nodeId: root-1
                      operator: AND
                      children:
                        - type: FIELD
                          nodeId: field-1
                          field: CONTENT
                          child:
                            type: TERM_SET
                            nodeId: term-1
                            matchMode: ANY
                            terms:
                              - source: CONCEPT
                                conceptId: "20"
                                conceptName: 人才
                                includeDescendants: false
                    references: []
                  options:
                    page: 1
                    size: 20
                    withHighlight: true
                    withItems: true
              impactMode:
                summary: IMPACT mode request
                value:
                  mode: IMPACT
                  runtimeEnvironmentId: 1
                  rule:
                    root:
                      type: LOGIC
                      nodeId: root-1
                      operator: AND
                      children:
                        - type: TERM_SET
                          nodeId: term-1
                          matchMode: ANY
                          terms:
                            - source: CONCEPT
                              conceptId: "20"
                              conceptName: 博士
                              includeDescendants: false
                        - type: TERM_SET
                          nodeId: term-2
                          matchMode: ANY
                          terms:
                            - source: CONCEPT
                              conceptId: "36"
                              conceptName: 人力社保部门
                              includeDescendants: false
                    references: []
                  options:
                    withItems: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleRuntimeExecuteResponse'
              examples:
                fullMode:
                  summary: FULL mode response
                  value:
                    mode: FULL
                    runtimeEnvironmentId: 1
                    total: 311
                    page: 1
                    size: 20
                    took: 43
                    items:
                      - id: doc-1
                        title: 关于人才补贴政策
                        matchedReasons:
                          - field: DOC_TEXT
                            label: 正文
                            displayText: 正文包含“人才”
                            matchedTerms: [人才]
                        highlightFragments:
                          - "...符合<mark>人才</mark>补贴条件..."
                    metadata:
                      engineVersion: "1.0"
                      executionId: "d4be8a53-c283-4fd2-8a75-d5f88f6ab020"
                nodeMode:
                  summary: NODE mode response
                  value:
                    mode: NODE
                    runtimeEnvironmentId: 1
                    nodeId: term-1
                    page: 1
                    size: 20
                    fullTotal: 311
                    nodeTotal: 860
                    delta: 549
                    took: 65
                    items:
                      - id: doc-2
                        title: 2023年度领军人才项目
                        matchedReasons:
                          - field: DOC_TEXT
                            label: 正文
                            displayText: 正文包含“博士”
                            matchedTerms: [博士]
                        highlightFragments:
                          - "...出站<mark>博士</mark>后可申报..."
                    metadata:
                      engineVersion: "1.0"
                      executionId: "2fe20bf6-184f-4f3a-a05d-f7c83d39ce8b"
                impactMode:
                  summary: IMPACT mode response
                  value:
                    mode: IMPACT
                    runtimeEnvironmentId: 1
                    fullTotal: 311
                    conditionCount: 2
                    took: 210
                    analysis:
                      - nodeId: term-1
                        label: 博士
                        removedTotal: 720
                        contribution: 409
                        impactLevel: HIGH
                      - nodeId: term-2
                        label: 人力社保部门
                        removedTotal: 323
                        contribution: 12
                        impactLevel: LOW
                    metadata:
                      engineVersion: "1.0"
                      executionId: "9369a176-387e-43d8-bf28-f75f01386158"
        '400':
          description: Validation or mapping error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Runtime environment or node unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/rules/runtime/execute/analysis:
    post:
      tags: [RulePreview]
      summary: Execute runtime rule analysis with aggregated statistics
      description: Aggregated full-scope statistics for term hits, node hits, contribution distribution, and dataset-level hit rate.
      operationId: executeRuntimeRuleAnalysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleRuntimeExecuteAnalysisRequest'
            example:
              runtimeEnvironmentId: 1
              rule:
                root:
                  type: LOGIC
                  nodeId: root-1
                  operator: AND
                  children:
                    - type: FIELD
                      nodeId: field-1
                      field: CONTENT
                      child:
                        type: TERM_SET
                        nodeId: term-1
                        matchMode: ANY
                        terms:
                          - source: TERM
                            conceptId: "alpha"
                            conceptName: alpha
                            includeDescendants: false
                    - type: TERM_SET
                      nodeId: term-2
                      matchMode: ANY
                      terms:
                        - source: CONCEPT
                          conceptId: "20"
                          conceptName: 人才
                          includeDescendants: false
                references: []
              options:
                bucketSizePercent: 10
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleRuntimeExecuteAnalysisResponse'
        '400':
          description: Validation or mapping error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Runtime environment unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '408':
          description: Execution timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/rules/runtime/compare:
    post:
      tags: [RulePreview]
      summary: Compare two rules under same runtime environment
      operationId: compareRuntimeRules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleRuntimeCompareRequest'
            example:
              runtimeEnvironmentId: 1
              ruleA:
                root:
                  type: TERM_SET
                  nodeId: a1
                  matchMode: ANY
                  terms:
                    - source: TERM
                      conceptId: alpha
                      conceptName: alpha
                      includeDescendants: false
                references: []
              ruleB:
                root:
                  type: TERM_SET
                  nodeId: b1
                  matchMode: ANY
                  terms:
                    - source: TERM
                      conceptId: beta
                      conceptName: beta
                      includeDescendants: false
                references: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleRuntimeCompareResponse'
        '400':
          description: Validation or mapping error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Runtime environment unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '408':
          description: Execution timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/rules/runtime/suggest:
    post:
      tags: [RulePreview]
      summary: Generate optimization suggestions for rule
      operationId: suggestRuntimeRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleRuntimeSuggestRequest'
            example:
              runtimeEnvironmentId: 1
              rule:
                root:
                  type: TERM_SET
                  nodeId: n1
                  matchMode: ANY
                  terms:
                    - source: TERM
                      conceptId: alpha
                      conceptName: alpha
                      includeDescendants: false
                references: []
              options:
                lowContributionThreshold: 0.05
                maxSuggestions: 20
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleRuntimeSuggestResponse'
        '400':
          description: Validation or mapping error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Runtime environment unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '408':
          description: Execution timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/rules/runtime/risk:
    post:
      tags: [RulePreview]
      summary: Evaluate runtime risk of a rule
      operationId: evaluateRuntimeRuleRisk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleRuntimeRiskRequest'
            example:
              runtimeEnvironmentId: 1
              rule:
                root:
                  type: TERM_SET
                  nodeId: n1
                  matchMode: ANY
                  terms:
                    - source: TERM
                      conceptId: alpha
                      conceptName: alpha
                      includeDescendants: false
                references: []
              options:
                slowExecutionMs: 2000
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleRuntimeRiskResponse'
        '400':
          description: Validation or mapping error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Runtime environment unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '408':
          description: Execution timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/rules/preview/document/{docId}:
    get:
      tags: [RulePreview]
      deprecated: true
      summary: Get preview document detail
      description: Deprecated legacy endpoint kept for compatibility.
      operationId: getPreviewDocumentDetail
      parameters:
        - name: docId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewDocumentDetailResponse'
        '404':
          description: Document not found in preview scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    RuntimeActiveItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        datasetName:
          type: string
        scopeLabel:
          type: string
      required: [id, name, datasetName, scopeLabel]

    RulePreviewRequest:
      type: object
      properties:
        ruleJson:
          type: object
          additionalProperties: true
        runtimeEnvironmentId:
          type: integer
          format: int64
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
      required: [ruleJson, runtimeEnvironmentId]

    NodePreviewRequest:
      type: object
      properties:
        ruleJson:
          type: object
          additionalProperties: true
        nodeId:
          type: string
        runtimeEnvironmentId:
          type: integer
          format: int64
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
      required: [ruleJson, nodeId, runtimeEnvironmentId]

    RuleRuntimeExecuteRequest:
      oneOf:
        - $ref: '#/components/schemas/RuleRuntimeExecuteFullRequest'
        - $ref: '#/components/schemas/RuleRuntimeExecuteNodeRequest'
        - $ref: '#/components/schemas/RuleRuntimeExecuteImpactRequest'
      discriminator:
        propertyName: mode
        mapping:
          FULL: '#/components/schemas/RuleRuntimeExecuteFullRequest'
          NODE: '#/components/schemas/RuleRuntimeExecuteNodeRequest'
          IMPACT: '#/components/schemas/RuleRuntimeExecuteImpactRequest'

    RuleRuntimeExecuteFullRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [FULL]
        runtimeEnvironmentId:
          type: integer
          format: int64
        rule:
          $ref: '#/components/schemas/UiRuleViewModel'
        options:
          $ref: '#/components/schemas/RuleRuntimeExecuteOptions'
      required: [mode, runtimeEnvironmentId, rule]

    RuleRuntimeExecuteNodeRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [NODE]
        runtimeEnvironmentId:
          type: integer
          format: int64
        rule:
          $ref: '#/components/schemas/UiRuleViewModel'
        nodeId:
          type: string
        options:
          $ref: '#/components/schemas/RuleRuntimeExecuteOptions'
      required: [mode, runtimeEnvironmentId, rule, nodeId]

    RuleRuntimeExecuteImpactRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [IMPACT]
        runtimeEnvironmentId:
          type: integer
          format: int64
        rule:
          $ref: '#/components/schemas/UiRuleViewModel'
        options:
          $ref: '#/components/schemas/RuleRuntimeExecuteImpactOptions'
      required: [mode, runtimeEnvironmentId, rule]

    RuleRuntimeExecuteOptions:
      type: object
      properties:
        page:
          type: integer
          format: int32
          minimum: 1
          default: 1
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
        withHighlight:
          type: boolean
          default: true
        withItems:
          type: boolean
          default: true

    RuleRuntimeExecuteImpactOptions:
      type: object
      properties:
        withHighlight:
          type: boolean
          enum: [false]
          default: false
        withItems:
          type: boolean
          enum: [false]
          default: false

    RuleRuntimeExecuteAnalysisRequest:
      type: object
      properties:
        runtimeEnvironmentId:
          type: integer
          format: int64
        rule:
          $ref: '#/components/schemas/UiRuleViewModel'
        options:
          $ref: '#/components/schemas/RuleRuntimeExecuteAnalysisOptions'
      required: [runtimeEnvironmentId, rule]

    RuleRuntimeExecuteAnalysisOptions:
      type: object
      properties:
        bucketSizePercent:
          type: integer
          format: int32
          minimum: 1
          maximum: 50
          default: 10

    RuleRuntimeExecuteAnalysisResponse:
      type: object
      properties:
        mode:
          type: string
          enum: [ANALYSIS]
        runtimeEnvironmentId:
          type: integer
          format: int64
        datasetTotal:
          type: integer
          format: int64
        ruleHit:
          type: integer
          format: int64
        hitRate:
          type: number
          format: double
        termStats:
          type: array
          items:
            $ref: '#/components/schemas/RuleRuntimeExecuteTermStat'
        nodeStats:
          type: array
          items:
            $ref: '#/components/schemas/RuleRuntimeExecuteNodeStat'
        distribution:
          type: object
          additionalProperties:
            type: integer
            format: int64
          example:
            0-10%: 2
            10-20%: 4
            20-30%: 6
        took:
          type: integer
          format: int64
        metadata:
          $ref: '#/components/schemas/RuntimeExecuteMetadata'
      required: [mode, runtimeEnvironmentId, datasetTotal, ruleHit, hitRate, termStats, nodeStats, distribution, took, metadata]

    RuleRuntimeExecuteTermStat:
      type: object
      properties:
        termId:
          type: string
        nodeId:
          type: string
          nullable: true
        hitCount:
          type: integer
          format: int64
        hitRate:
          type: number
          format: double
      required: [termId, hitCount, hitRate]

    RuleRuntimeExecuteNodeStat:
      type: object
      properties:
        nodeId:
          type: string
          nullable: true
        nodeType:
          type: string
        hitCount:
          type: integer
          format: int64
        contribution:
          type: number
          format: double
      required: [nodeType, hitCount, contribution]

    RuleRuntimeCompareRequest:
      type: object
      properties:
        runtimeEnvironmentId:
          type: integer
          format: int64
        ruleA:
          $ref: '#/components/schemas/UiRuleViewModel'
        ruleB:
          $ref: '#/components/schemas/UiRuleViewModel'
      required: [runtimeEnvironmentId, ruleA, ruleB]

    RuleRuntimeCompareResponse:
      type: object
      properties:
        mode:
          type: string
          enum: [COMPARE]
        runtimeEnvironmentId:
          type: integer
          format: int64
        ruleAHit:
          type: integer
          format: int64
        ruleBHit:
          type: integer
          format: int64
        overlap:
          type: integer
          format: int64
        onlyA:
          type: integer
          format: int64
        onlyB:
          type: integer
          format: int64
        took:
          type: integer
          format: int64
        metadata:
          $ref: '#/components/schemas/RuntimeExecuteMetadata'
      required: [mode, runtimeEnvironmentId, ruleAHit, ruleBHit, overlap, onlyA, onlyB, took, metadata]

    RuleRuntimeSuggestRequest:
      type: object
      properties:
        runtimeEnvironmentId:
          type: integer
          format: int64
        rule:
          $ref: '#/components/schemas/UiRuleViewModel'
        options:
          $ref: '#/components/schemas/RuleRuntimeSuggestOptions'
      required: [runtimeEnvironmentId, rule]

    RuleRuntimeSuggestOptions:
      type: object
      properties:
        lowContributionThreshold:
          type: number
          format: double
          default: 0.05
        maxSuggestions:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20

    RuleRuntimeSuggestion:
      type: object
      properties:
        type:
          type: string
        nodeId:
          type: string
          nullable: true
        termId:
          type: string
          nullable: true
        message:
          type: string
        score:
          type: number
          format: double
      required: [type, message, score]

    RuleRuntimeSuggestResponse:
      type: object
      properties:
        mode:
          type: string
          enum: [SUGGEST]
        runtimeEnvironmentId:
          type: integer
          format: int64
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/RuleRuntimeSuggestion'
        took:
          type: integer
          format: int64
        metadata:
          $ref: '#/components/schemas/RuntimeExecuteMetadata'
      required: [mode, runtimeEnvironmentId, suggestions, took, metadata]

    RuleRuntimeRiskRequest:
      type: object
      properties:
        runtimeEnvironmentId:
          type: integer
          format: int64
        rule:
          $ref: '#/components/schemas/UiRuleViewModel'
        options:
          $ref: '#/components/schemas/RuleRuntimeRiskOptions'
      required: [runtimeEnvironmentId, rule]

    RuleRuntimeRiskOptions:
      type: object
      properties:
        slowExecutionMs:
          type: integer
          format: int64
          default: 2000

    RuleRuntimeRiskResponse:
      type: object
      properties:
        mode:
          type: string
          enum: [RISK]
        runtimeEnvironmentId:
          type: integer
          format: int64
        riskLevel:
          type: string
          enum: [LOW, MEDIUM, HIGH]
        riskScore:
          type: integer
          format: int32
        riskFactors:
          type: array
          items:
            type: string
        clauseCount:
          type: integer
          format: int32
        maxDepth:
          type: integer
          format: int32
        complexityScore:
          type: integer
          format: int32
        hitRate:
          type: number
          format: double
        executeTime:
          type: integer
          format: int64
        took:
          type: integer
          format: int64
        metadata:
          $ref: '#/components/schemas/RuntimeExecuteMetadata'
      required: [mode, runtimeEnvironmentId, riskLevel, riskScore, riskFactors, clauseCount, maxDepth, complexityScore, hitRate, executeTime, took, metadata]

    RuleAnalyzeRequest:
      type: object
      properties:
        rule_json:
          $ref: '#/components/schemas/UiRuleViewModel'
      required: [rule_json]

    RuleAnalyzeResponse:
      type: object
      properties:
        depth:
          type: integer
          format: int32
        clauseCount:
          type: integer
          format: int32
        logicCount:
          type: integer
          format: int32
        operatorCount:
          type: integer
          format: int32
        proximityCount:
          type: integer
          format: int32
        logicDensity:
          type: number
          format: double
        complexityScore:
          type: integer
          format: int32
      required: [depth, clauseCount, logicCount, operatorCount, proximityCount, logicDensity, complexityScore]

    RuleVersionListItem:
      type: object
      properties:
        version:
          type: integer
          format: int32
        createdBy:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [version, createdAt]

    RuleVersionResponse:
      type: object
      properties:
        id:
          type: string
        version:
          type: integer
          format: int32
        rule:
          $ref: '#/components/schemas/UiRuleViewModel'
        createdBy:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, version, rule, createdAt]

    RuleDiffModifiedNode:
      type: object
      properties:
        path:
          type: string
        before:
          type: string
        after:
          type: string
      required: [path, before, after]

    RuleDiffResponse:
      type: object
      properties:
        addedNodes:
          type: array
          items:
            type: string
        removedNodes:
          type: array
          items:
            type: string
        modifiedNodes:
          type: array
          items:
            $ref: '#/components/schemas/RuleDiffModifiedNode'
      required: [addedNodes, removedNodes, modifiedNodes]

    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required: [code, message]

    ApiResponseVoid:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          nullable: true
        error:
          $ref: '#/components/schemas/ApiError'
      required: [success]

    ApiResponseRuleAnalyzeResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/RuleAnalyzeResponse'
        error:
          $ref: '#/components/schemas/ApiError'
      required: [success]

    ApiResponseRuleVersionList:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/RuleVersionListItem'
        error:
          $ref: '#/components/schemas/ApiError'
      required: [success]

    ApiResponseRuleVersionResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/RuleVersionResponse'
        error:
          $ref: '#/components/schemas/ApiError'
      required: [success]

    ApiResponseRuleDiffResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/RuleDiffResponse'
        error:
          $ref: '#/components/schemas/ApiError'
      required: [success]

    UiRuleViewModel:
      type: object
      properties:
        root:
          $ref: '#/components/schemas/UiExpressionNode'
        references:
          type: array
          items:
            $ref: '#/components/schemas/UiRuleReference'
      required: [root]

    UiExpressionNode:
      oneOf:
        - $ref: '#/components/schemas/UiLogicNode'
        - $ref: '#/components/schemas/UiProximityNode'
        - $ref: '#/components/schemas/UiPositionRelationNode'
        - $ref: '#/components/schemas/UiStructureNode'
        - $ref: '#/components/schemas/UiFieldNode'
        - $ref: '#/components/schemas/UiTermSetNode'
        - $ref: '#/components/schemas/UiNotNode'
        - $ref: '#/components/schemas/UiScoreNode'
        - $ref: '#/components/schemas/UiTopicRefNode'
      discriminator:
        propertyName: type
        mapping:
          LOGIC: '#/components/schemas/UiLogicNode'
          PROXIMITY: '#/components/schemas/UiProximityNode'
          POSITION_RELATION: '#/components/schemas/UiPositionRelationNode'
          STRUCTURE: '#/components/schemas/UiStructureNode'
          FIELD: '#/components/schemas/UiFieldNode'
          TERM_SET: '#/components/schemas/UiTermSetNode'
          NOT: '#/components/schemas/UiNotNode'
          SCORE: '#/components/schemas/UiScoreNode'
          TOPIC_REF: '#/components/schemas/UiTopicRefNode'

    UiLogicNode:
      type: object
      properties:
        type:
          type: string
          enum: [LOGIC]
        nodeId:
          type: string
        operator:
          type: string
        threshold:
          type: integer
          format: int32
        children:
          type: array
          items:
            $ref: '#/components/schemas/UiExpressionNode'
      required: [type, children]

    UiProximityNode:
      type: object
      properties:
        type:
          type: string
          enum: [PROXIMITY]
        nodeId:
          type: string
        relation:
          type: string
        ordered:
          type: boolean
        distance:
          type: integer
          format: int32
        children:
          type: array
          items:
            $ref: '#/components/schemas/UiExpressionNode'
      required: [type, children]

    UiPositionRelationNode:
      type: object
      properties:
        type:
          type: string
          enum: [POSITION_RELATION]
        nodeId:
          type: string
        mode:
          type: string
          enum: [PROXIMITY]
        relation:
          type: string
        ordered:
          type: boolean
        distance:
          type: integer
          format: int32
        children:
          type: array
          items:
            $ref: '#/components/schemas/UiExpressionNode'
      required: [type, mode, children]

    UiStructureNode:
      type: object
      properties:
        type:
          type: string
          enum: [STRUCTURE]
        nodeId:
          type: string
        scope:
          type: string
          enum: [NONE, SENTENCE, PARAGRAPH]
        child:
          $ref: '#/components/schemas/UiExpressionNode'
      required: [type, scope, child]

    UiFieldNode:
      type: object
      properties:
        type:
          type: string
          enum: [FIELD]
        nodeId:
          type: string
        field:
          type: string
        child:
          $ref: '#/components/schemas/UiExpressionNode'
      required: [type, field, child]

    UiTermSetNode:
      type: object
      properties:
        type:
          type: string
          enum: [TERM_SET]
        nodeId:
          type: string
        terms:
          type: array
          items:
            $ref: '#/components/schemas/UiExpression'
        matchMode:
          type: string
          enum: [ANY, ALL]
      required: [type, terms]

    UiNotNode:
      type: object
      properties:
        type:
          type: string
          enum: [NOT]
        nodeId:
          type: string
        child:
          $ref: '#/components/schemas/UiExpressionNode'
      required: [type, child]

    UiScoreNode:
      type: object
      properties:
        type:
          type: string
          enum: [SCORE]
        nodeId:
          type: string
        operator:
          type: string
        threshold:
          type: integer
          format: int32
        children:
          type: array
          items:
            $ref: '#/components/schemas/UiExpressionNode'
      required: [type, children]

    UiTopicRefNode:
      type: object
      properties:
        type:
          type: string
          enum: [TOPIC_REF]
        nodeId:
          type: string
        topicId:
          type: string
      required: [type, topicId]

    UiExpression:
      type: object
      properties:
        source:
          type: string
          enum: [CONCEPT, TERM]
        conceptId:
          type: string
          description: Required. For CONCEPT use concept id; for TERM use literal term text.
        conceptName:
          type: string
        includeDescendants:
          type: boolean
      required: [source, conceptId]

    UiRuleReference:
      type: object
      properties:
        type:
          type: string
        topicId:
          type: string
        mode:
          type: string
      required: [type, topicId]

    MatchedReasonView:
      type: object
      properties:
        field:
          type: string
        label:
          type: string
        displayText:
          type: string
        matchedTerms:
          type: array
          items:
            type: string
      required: [field, label, displayText, matchedTerms]

    RulePreviewItem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        matchedReasons:
          type: array
          items:
            $ref: '#/components/schemas/MatchedReasonView'
        highlightFragments:
          type: array
          items:
            type: string
      required: [id, title, matchedReasons, highlightFragments]

    ImpactConditionView:
      type: object
      properties:
        nodeId:
          type: string
        label:
          type: string
        removedTotal:
